<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: Young Serif (display) + Source Sans 3 (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Young+Serif&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Young+Serif&display=swap"
    />

    <meta
      name="description"
      content="Visual AI is an AI image studio: text to image with FLUX, 4K upscale, colorize, restore old photos, and remove backgrounds. Free daily credits."
    />

    <meta property="og:title" content="Visual AI – AI image generator" />
    <meta
      property="og:description"
      content="Generate, upscale, colorize, and restore images in the browser. Credits only — no Discord."
    />
    <meta property="og:image" content="https://visual-ai.app/og-image.png" />
    <meta property="og:url" content="https://visual-ai.app" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Visual AI – AI image generator" />
    <meta
      name="twitter:description"
      content="Generate, upscale, colorize, and restore images in the browser. Credits only — no Discord."
    />
    <meta name="twitter:image" content="https://visual-ai.app/og-image.png" />

    <link rel="canonical" href="https://visual-ai.app" />

    <title>Visual AI – AI image generator</title>

    <script>
      (function () {
        if (localStorage.getItem('visual-ai-theme') !== 'false') {
          document.documentElement.classList.add('tw-dark');
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Visual AI",
        "url": "https://visual-ai.app",
        "description": "AI studio for text-to-image, upscaling, colorize, photo restore, and background removal.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web Browser",
        "creator": {
          "@type": "Organization",
          "name": "Visual AI",
          "url": "https://visual-ai.app"
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
