# HTTP www → HTTPS apex (ACME kept so www certs can renew)
server {
    listen 80;
    server_name www.visual-ai.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://visual-ai.app$request_uri;
    }
}

# HTTPS www → HTTPS apex
server {
    listen 443 ssl;
    server_name www.visual-ai.app;

    ssl_certificate /etc/letsencrypt/live/visual-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visual-ai.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://visual-ai.app$request_uri;
}

# HTTP apex → vue-app
server {
    listen 80;
    server_name visual-ai.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vue-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS apex → vue-app
server {
    listen 443 ssl;
    server_name visual-ai.app;

    ssl_certificate /etc/letsencrypt/live/visual-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visual-ai.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://vue-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
