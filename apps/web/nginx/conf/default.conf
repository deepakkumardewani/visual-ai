server {
    listen 80;
    server_name visual-ai.app www.visual-ai.app;

    location / {
        proxy_pass http://vue-app:80; # Forward to Vue app container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name visual-ai.app www.visual-ai.app;

    ssl_certificate /etc/letsencrypt/live/visual-ai.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visual-ai.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://vue-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}