server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Landing media is content-hashed, so it is safe to cache forever
    location ^~ /landing/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Known static extensions: serve the file or 404 (no SPA shell)
    location ~* \.(txt|md|xml|json|png|jpg|jpeg|gif|webp|ico|js|css|woff|woff2|map|svg|mp4|webm)$ {
        try_files $uri =404;
    }

    # Extensionless app routes: SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
