server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Known static extensions: serve the file or 404 (no SPA shell)
    location ~* \.(txt|md|xml|json|png|jpg|jpeg|gif|webp|ico|js|css|woff|woff2|map|svg)$ {
        try_files $uri =404;
    }

    # Extensionless app routes: SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
