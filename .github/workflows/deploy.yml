name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ../private.key
          sudo chmod 600 ../private.key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SSH_KNOWN_HOSTS: ${{secrets.SSH_KNOWN_HOSTS}}
          SSH_KEY_PATH: ${{ github.workspace }}/../private.key

      - name: Build and Deploy Docker Image
        run: |
          ssh -i $SSH_KEY_PATH ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} << EOF
          # Ensure Docker is installed
          if ! [ -x "$(command -v docker)" ]; then
            apt-get update
            apt-get install -y docker.io
          fi

          # Pull latest changes from GitHub
          cd /root/visual-ai/frontend/visual-ai || exit
          git pull

          # Build and run the updated Docker container
          docker build -t vue-app .
          docker stop vue-app || true
          docker rm vue-app || true
          docker run -d -p 8080:80 --name vue-app vue-app
          EOF
