name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fake build-time values. The Clerk key is base64("ci-fake12.clerk.invalid$"): it must be
      # structurally valid for Clerk to mount (prerender waits for rendered content), and the
      # .invalid host never resolves, so no real Clerk instance is contacted.
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktZmFrZTEyLmNsZXJrLmludmFsaWQk
      VITE_TELEMETRYDECK_APP_ID: ci-fake
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Build shared package
        run: bun run build
        working-directory: packages/shared
      - name: Lint
        run: bunx vp lint apps/web
      - name: Format and type check
        run: bunx vp check apps/web
      - name: Unit tests
        run: bunx vp test run
        working-directory: apps/web
      - name: Install Chromium for prerender
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Build
        run: bun run build
        working-directory: apps/web

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Obviously fake values so any accidental outbound call fails with 401.
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/ci
      CLOUDINARY_CLOUD_NAME: ci-fake
      CLOUDINARY_API_KEY: ci-fake
      CLOUDINARY_API_SECRET: ci-fake
      CLOUDINARY_BASE_PATH: private/ci/uploads
      CLERK_SECRET_KEY: ci-fake
      CLERK_PUBLISHABLE_KEY: ci-fake
      CLERK_JWT_KEY: ci-fake
      REPLICATE_API_TOKEN: ci-fake
      PAYMENT_PROVIDER: dodo
      PAYMENT_RETURN_URL: https://ci.invalid/checkout/return
      DODO_PAYMENTS_API_KEY: ci-fake
      DODO_PAYMENTS_ENVIRONMENT: test_mode
      DODO_PAYMENTS_WEBHOOK_KEY: ci-fake
      DODO_PRODUCT_ID_PACK_300_USD: ci-fake
      DODO_PRODUCT_ID_PACK_300_INR: ci-fake
      DODO_PRODUCT_ID_PACK_700_USD: ci-fake
      DODO_PRODUCT_ID_PACK_700_INR: ci-fake
      DODO_PRODUCT_ID_PACK_1600_USD: ci-fake
      DODO_PRODUCT_ID_PACK_1600_INR: ci-fake
      DODO_PRODUCT_ID_PACK_4500_USD: ci-fake
      DODO_PRODUCT_ID_PACK_4500_INR: ci-fake
      DODO_PRODUCT_ID_PRO: ci-fake
      EMAIL_USER: ci@example.invalid
      EMAIL_PASSWORD: ci-fake
      WEBHOOK_SECRET: ci-fake
      DEEPSEEK_API_KEY: ci-fake
      ANTHROPIC_API_KEY: ci-fake
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Build shared package
        run: bun run build
        working-directory: packages/shared
      - name: Lint
        run: bunx vp lint apps/api packages
      - name: Format check
        run: bunx vp check apps/api packages
      - name: Type check
        run: bun run type-check
        working-directory: apps/api
      - name: Unit tests
        run: bun run test
        working-directory: apps/api
      - name: Build
        run: bun run build
        working-directory: apps/api

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [web, api]
    if: always()
    steps:
      - name: Require all jobs to succeed
        run: |
          if [ "${{ needs.web.result }}" != "success" ] || [ "${{ needs.api.result }}" != "success" ]; then
            echo "web=${{ needs.web.result }} api=${{ needs.api.result }}"
            exit 1
          fi
