# Security headers, included per-location.
#
# nginx's add_header does NOT merge across levels: any add_header inside a
# location discards every add_header inherited from the server block. Each
# location that sets its own header must therefore re-include these.
#
# Deploy to /etc/nginx/snippets/security-headers.conf on the droplet.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
