# Overrides for GET /progress, the Server-Sent Events stream that drives the
# generation progress bar (apps/api/src/routes/generate.ts).
#
# Include AFTER proxy-params.conf so these win.
#
# The 60s proxy_read_timeout is measured between reads from the upstream, and a
# generation can run far longer than that between events — nginx would close the
# stream mid-job and the browser would show a stalled progress bar. Buffering is
# switched off explicitly rather than relying on the app's X-Accel-Buffering
# header, so the stream survives if that header is ever dropped.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 1h;
