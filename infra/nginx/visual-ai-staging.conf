# Staging hosts.
#
#   staging.visual-ai.app     -> static SPA in /var/www/staging
#   api-staging.visual-ai.app -> api-staging container on 127.0.0.1:3002
#
# Deployed first, alongside the untouched legacy prod config; see checklist §D.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.visual-ai.app;

    # Server-level so the static-asset regex location resolves against it too.
    root /var/www/staging;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/static-site.conf;

    access_log /var/log/nginx/staging.visual-ai.app-access.log;
    error_log  /var/log/nginx/staging.visual-ai.app-error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-staging.visual-ai.app;

    include /etc/nginx/snippets/tls.conf;

    # Uploaded images and generation payloads exceed the 1m default.
    client_max_body_size 25m;

    # SSE progress stream — must not be buffered or cut off at 60s.
    location = /progress {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/sse-params.conf;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    access_log /var/log/nginx/api-staging.visual-ai.app-access.log;
    error_log  /var/log/nginx/api-staging.visual-ai.app-error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.visual-ai.app api-staging.visual-ai.app;
    return 301 https://$host$request_uri;
}
