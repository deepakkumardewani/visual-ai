# Production hosts.
#
#   visual-ai.app     -> static SPA in /var/www/prod
#   www.visual-ai.app -> redirect to the apex
#   api.visual-ai.app -> api-prod container on 127.0.0.1:3001
#
# ⚠️ Deploy ONLY during the cutover window (checklist §F4), after the legacy
# certbot-managed config is removed — both declare these same hostnames.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name visual-ai.app;

    root /var/www/prod;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/static-site.conf;

    access_log /var/log/nginx/visual-ai.app-access.log;
    error_log  /var/log/nginx/visual-ai.app-error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.visual-ai.app;

    include /etc/nginx/snippets/tls.conf;

    client_max_body_size 25m;

    # SSE progress stream — must not be buffered or cut off at 60s.
    location = /progress {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/sse-params.conf;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    access_log /var/log/nginx/api.visual-ai.app-access.log;
    error_log  /var/log/nginx/api.visual-ai.app-error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.visual-ai.app;

    include /etc/nginx/snippets/tls.conf;

    return 301 https://visual-ai.app$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name visual-ai.app www.visual-ai.app api.visual-ai.app;
    return 301 https://$host$request_uri;
}
