# Shared SPA-serving behaviour. The server block must set `root` before
# including this. Note: a location that sets its own add_header discards
# inherited ones, hence the repeated security-headers include.
gzip on;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
gzip_min_length 1000;
gzip_disable "msie6";

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location / {
    limit_req zone=general_limit burst=60 nodelay;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/security-headers.conf;
}
