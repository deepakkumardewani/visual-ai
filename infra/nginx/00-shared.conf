# http-level directives shared by every site config. The `00-` prefix makes
# nginx load this before any site that references what it defines.

# Rate-limit zones — may be declared exactly once per http block.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Only forward `Connection: upgrade` for requests that actually ask to upgrade.
# Hardcoding it sends the header on ordinary requests too, which breaks upstream
# keepalive and confuses the SSE endpoint (see proxy-params.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
