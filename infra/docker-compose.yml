version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: visual-ai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-defaultpass} --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpass}
    mem_limit: 160m
    restart: unless-stopped
    networks:
      - visual-ai-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api-prod:
    image: ${GHCR_IMAGE}:${GHCR_TAG:-latest}
    container_name: visual-ai-api-prod
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - ENABLE_CRON=true
      - QUEUE_PREFIX=prod
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpass}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 300m
    restart: unless-stopped
    networks:
      - visual-ai-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  api-staging:
    image: ${GHCR_IMAGE}:${GHCR_TAG:-latest}
    container_name: visual-ai-api-staging
    env_file: .env.staging
    environment:
      - NODE_ENV=staging
      - ENABLE_CRON=false
      - QUEUE_PREFIX=staging
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpass}
    ports:
      - '127.0.0.1:3002:3001'
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 250m
    restart: unless-stopped
    networks:
      - visual-ai-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local

networks:
  visual-ai-network:
    driver: bridge
