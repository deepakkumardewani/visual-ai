services:
  vue-app:
    build:
      context: .
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '8080:80'
    restart: always

  nginx:
    image: nginx:alpine
    # volumes:
    #   - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    #   - ./certbot/conf:/etc/letsencrypt
    #   - ./certbot/www:/var/www/certbot
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - vue-app
    restart: always
