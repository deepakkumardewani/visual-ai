<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing and Pro Polish · Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* surfaces tinted toward indigo hue 275 */
  --bg:oklch(0.17 0.012 275);
  --surface:oklch(0.21 0.014 275);
  --surface-2:oklch(0.25 0.016 275);
  --line:oklch(0.34 0.02 275);
  --text:oklch(0.95 0.006 275);
  --text-2:oklch(0.78 0.015 275);
  --text-3:oklch(0.68 0.02 275);
  --accent:oklch(0.68 0.17 277);
  --accent-ink:oklch(0.16 0.03 277);
  --accent-soft:oklch(0.30 0.07 277);
  --accent-text:oklch(0.82 0.1 277);
  --s-verified:oklch(0.78 0.15 155);
  --s-built:oklch(0.82 0.13 85);
  --s-verifying:oklch(0.80 0.11 215);
  --s-building:oklch(0.80 0.12 250);
  --s-queued:oklch(0.76 0.03 275);
  --s-ready:oklch(0.82 0.08 185);
  --s-waiting:oklch(0.66 0.025 275);
  --s-failed:oklch(0.74 0.17 25);
  --s-blocked:oklch(0.76 0.15 55);
  --space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:24px;--space-2xl:32px;--space-3xl:48px;
  --radius:8px;--radius-sm:4px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-body:"Schibsted Grotesk",system-ui,sans-serif;
  --font-display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent-text)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.wrap{max-width:1200px;margin:0 auto;padding:var(--space-xl) var(--space-lg) var(--space-3xl)}
.mono{font-family:var(--font-mono);font-size:13px}
.muted{color:var(--text-2)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.15}
h2{font-size:18px;line-height:1.3}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
code.ic{font-family:var(--font-mono);font-size:.9em;padding:0 4px;border-radius:var(--radius-sm);background:var(--bg);color:var(--accent-text)}

/* header */
header.top{display:grid;grid-template-columns:1fr auto;gap:var(--space-md) var(--space-lg);align-items:end;margin-bottom:var(--space-lg)}
.top-meta{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;justify-content:flex-end}
.updated{font-size:13px;color:var(--text-3)}
.stalled{display:inline-block;margin-left:var(--space-sm);padding:2px 8px;border-radius:var(--radius-sm);background:oklch(0.30 0.07 55);color:var(--s-blocked);font-weight:600;font-size:12px}
.progress{grid-column:1/-1;display:grid;gap:var(--space-sm)}
.prog-head{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-xs) var(--space-sm);color:var(--text-2);font-size:14px}
.prog-head .pct{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1;color:var(--text)}
.prog-head .sep{color:var(--text-3)}
.progress .bar{height:10px}
.bar{background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex;height:8px}
.bar>i{display:block;height:100%;background:var(--s-verified);transition:width .3s var(--ease)}
.bar>i.b,.sw.b{background:repeating-linear-gradient(135deg,var(--s-built) 0 3px,color-mix(in oklch,var(--s-built) 22%,var(--surface-2)) 3px 6px)}
.bar>i.a{background:var(--accent)}
.bar>i.x{background:var(--s-failed)}
.bar.sm{height:6px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-xs) var(--space-lg);font-size:13px;color:var(--text-2)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sw{flex:none;width:10px;height:10px;border-radius:2px;background:var(--s-verified)}
.sw.a{background:var(--accent)}
.sw.x{background:var(--s-failed)}
.sw.r{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.notasks{margin:0;padding:var(--space-sm) var(--space-md);border:1px dashed var(--s-blocked);border-radius:var(--radius);font-size:13px;color:var(--text-2);max-width:80ch}
.notasks strong{color:var(--s-blocked)}

/* constraint banner: compact */
.constraint{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-sm) var(--space-md);border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);margin-bottom:var(--space-lg)}
.constraint svg{flex:none;margin-top:2px}
.constraint p{margin:0;font-size:13px;line-height:1.45;color:var(--text-2);max-width:80ch}
.constraint strong{color:var(--text)}

/* panels */
section.panel{margin-top:var(--space-2xl)}
.panel-head{display:flex;align-items:baseline;gap:var(--space-md);margin-bottom:var(--space-md);flex-wrap:wrap}
.count{font-size:13px;color:var(--text-3)}
.sub-h{margin:0 0 var(--space-sm);font-family:var(--font-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-lg)}

/* status pill: 11px caps, 4px radius, no border; icon + text so color is not alone */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:var(--radius-sm);background:color-mix(in oklch,var(--c) 18%,var(--surface));color:var(--c);white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill.built{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}
.pill.built svg{stroke-dasharray:2 2}
.st-verified{--c:var(--s-verified)}.st-built{--c:var(--s-built)}.st-verifying{--c:var(--s-verifying)}.st-building{--c:var(--s-building)}
.st-queued{--c:var(--s-queued)}.st-ready{--c:var(--s-ready)}.st-waiting{--c:var(--s-waiting)}.st-failed{--c:var(--s-failed)}.st-blocked{--c:var(--s-blocked)}
.st-accent{--c:var(--accent-text)}.st-muted{--c:var(--text-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{background:var(--accent)}
.btn.copied{border-color:var(--s-verified);color:var(--s-verified)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.quiet:hover{border-color:var(--accent);background:var(--accent-soft)}
.push{margin-left:auto}
/* disclosure: chevron + label + count, state in state.ui.open */
.disc{display:inline-flex;align-items:center;gap:var(--space-sm);min-height:36px;padding:4px 0;background:none;border:0;cursor:pointer;font-weight:600;font-size:14px;text-align:left;color:var(--text)}
.disc .chev{color:var(--text-3);transition:transform .2s var(--ease)}
.disc[aria-expanded=true] .chev{transform:rotate(90deg)}
.disc .dct{font-weight:400;font-size:13px;color:var(--text-3)}
.disc:hover .chev{color:var(--accent-text)}

/* now: compact card */
.now-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md)}
.now-head h3{font-size:16px}
.now-name{font-size:14px;color:var(--text-2)}
.now-meta{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md);font-size:13px;color:var(--text-2)}
.now-sum{margin:var(--space-sm) 0 0;font-size:14px;color:var(--text-2);max-width:90ch}
.now-sum b{color:var(--text);font-weight:600}
.att{display:inline-flex;align-items:center;gap:6px}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pips i.on{background:var(--accent)}
.pips.last i.on{background:var(--s-failed)}
.now .running{list-style:none;margin:var(--space-sm) 0 0;padding:0;display:grid;gap:6px}
.now .running li{display:grid;grid-template-columns:96px 56px 1fr;gap:var(--space-sm);align-items:center;font-size:14px}
.now .running li .pill{justify-self:start}
.now .ready{list-style:none;margin:var(--space-sm) 0 0;padding:0;display:grid;gap:4px}
.now .ready li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--space-sm);align-items:center;width:100%;min-height:36px;font-size:14px;border-radius:var(--radius-sm)}
.now .ready li button:hover{background:var(--surface-2)}
.now .ready li button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
section.panel.panel-tight{margin-top:var(--space-lg)}
.now-done{margin:0;font-size:14px;color:var(--text-2)}
.now-idle{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm)}
.now-idle .cmd{flex:1 1 280px;margin:0}
.cmd{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;margin-top:var(--space-sm)}
.cmd code{flex:1 1 220px;min-width:0;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font-mono);font-size:13px}

/* phases: compact cards; selection drives Phase detail only */
.phases{display:grid;gap:var(--space-sm);grid-template-columns:repeat(auto-fill,minmax(156px,1fr))}
@media(min-width:720px){.phases{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.phase{display:grid;gap:var(--space-sm);grid-template-rows:auto auto 1fr;align-content:stretch;text-align:left;cursor:pointer;width:100%;min-height:44px;padding:var(--space-md);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);transition:border-color .15s var(--ease),background .15s var(--ease)}
.phase:hover{border-color:color-mix(in oklch,var(--accent) 55%,var(--line))}
.phase[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in oklch,var(--accent) 14%,var(--surface))}
.phase[aria-pressed=true] .pid{color:var(--accent-text)}
.ptop{display:flex;gap:6px;align-items:flex-start;min-width:0}
.pid{flex:none;font-family:var(--font-mono);font-size:12px;line-height:1.3;padding-top:2px;color:var(--text-3)}
.pname{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nowtag{flex:none;display:inline-flex;align-items:center;gap:4px;padding-top:3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text)}
.nowtag i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.gate{flex:none;display:inline-flex;align-self:flex-start;padding-top:2px;color:var(--s-verified)}
.risk{flex:none;display:inline-flex;align-self:flex-start;padding-top:2px;color:var(--s-blocked)}
.risktag{display:inline-flex;align-items:center;gap:4px;margin-left:var(--space-sm);padding:1px 7px;border-radius:var(--radius-sm);background:color-mix(in oklch,var(--s-blocked) 18%,var(--surface));color:var(--s-blocked);font-family:var(--font-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;vertical-align:middle}
.pmeta{align-self:start;display:flex;flex-wrap:wrap;gap:2px var(--space-md);font-size:12px;color:var(--text-2)}
.pmeta b{color:var(--text);font-weight:600}
.pmeta .pb{color:var(--s-built)}
.pmeta .pa{color:var(--accent-text)}
.pmeta .pbad{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--c)}
.pmeta .pbad svg{width:11px;height:11px}

/* phase detail */
.pd-grid{display:grid;gap:var(--space-lg) var(--space-xl);grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.pd-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pd-block{min-width:0}
.pd-block .txt,.pd-block li{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.pd-block ol,.pd-block ul{margin:0;padding-left:20px;display:grid;gap:6px}
.pd-block .quiet-note{margin:0;font-size:13px;color:var(--text-3)}
.pd-cp{margin:0 0 var(--space-sm);font-size:13px;color:var(--text-2)}
.pd-proof{grid-column:1/-1;border-top:1px solid var(--line);padding-top:var(--space-sm)}
.panel-head .pid{font-size:14px;color:var(--accent-text)}
.panel-head .hint{font-size:12px;color:var(--text-3)}

/* attention panels */
.attn{border:1px solid var(--s-failed);background:color-mix(in oklch,var(--s-failed) 10%,var(--surface))}
.stuckitem+.stuckitem{margin-top:var(--space-md)}
.kv{display:grid;gap:2px;font-size:14px}
.kv>span:first-child{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.stuckitem{padding:var(--space-md);background:var(--bg);border-radius:var(--radius-sm);display:grid;gap:var(--space-xs)}

/* questions */
.id{font-family:var(--font-mono);color:var(--accent-text);font-weight:500}
.panel-head.qhead{align-items:center}
.panel-head.qhead.shut{margin-bottom:0}
.count.badge{padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.qlist{border:1px solid var(--accent);background:var(--surface);border-radius:var(--radius);overflow:hidden}
.qrow{display:grid;grid-template-columns:1fr auto;column-gap:var(--space-sm);align-items:start;padding-right:var(--space-md)}
.qrow+.qrow{border-top:1px solid var(--line)}
.qrow.open{background:color-mix(in oklch,var(--accent-soft) 35%,var(--surface))}
.qtoggle{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:var(--space-sm);align-items:start;min-height:56px;padding:var(--space-md) 0 var(--space-md) var(--space-md)}
.qtoggle:hover{background:var(--surface-2)}
.qtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qchev{display:grid;place-items:center;width:20px;height:20px;margin-top:1px;color:var(--text-3);transition:transform .2s var(--ease)}
.qtoggle[aria-expanded=true] .qchev{transform:rotate(90deg)}
.qmain{display:grid;gap:2px;min-width:0}
.qmeta{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-xs) var(--space-sm);font-size:12px;color:var(--text-3)}
.qmeta .id{font-size:13px}
.qtext{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-size:14px}
.qrow.open .qtext{display:block;-webkit-line-clamp:unset;line-clamp:unset}
.qact{display:flex;gap:var(--space-sm);align-items:center;align-self:start;padding:10px 0}
.qdetail{grid-column:1/-1;display:grid;gap:var(--space-sm);padding:0 0 var(--space-md) calc(var(--space-md) + 20px + var(--space-sm))}
.qdetail[hidden]{display:none}
.qhint{margin:0;font-size:13px;color:var(--text-3)}
.qdonebar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm);margin-top:var(--space-sm);font-size:13px}
.qdonebar>.btn.quiet:first-child{margin-inline-start:calc(-1 * var(--space-md))}
.qdonelist{list-style:none;margin:var(--space-xs) 0 0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.qdonelist li{display:grid;grid-template-columns:1fr auto;gap:var(--space-sm);align-items:center;padding:var(--space-sm) var(--space-md)}
.qdonelist li+li{border-top:1px solid var(--line)}
.qdonelist .qclamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden;overflow-wrap:anywhere;font-size:14px}
.qdonelist .sub{font-size:12px;color:var(--text-3)}
.qempty{margin:0;padding:var(--space-md) var(--space-lg);border:1px dashed var(--line);border-radius:var(--radius);color:var(--text-2);font-size:14px}

/* feed: deliverables | activity */
.list{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-md)}
.feed{display:grid;gap:var(--space-2xl);margin-top:var(--space-2xl);grid-template-columns:minmax(0,1fr);align-items:start}
.feed>section.panel{margin-top:0;min-width:0}
@media(min-width:1000px){.feed{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}

/* shared bits */
.tag{font-family:var(--font-mono);font-size:12px;line-height:1.4;padding:1px 6px;border-radius:var(--radius-sm);background:var(--bg);color:var(--accent-text);white-space:nowrap}
a.tag{text-decoration:none}
a.tag:hover{text-decoration:underline}
.tag.more-tag{color:var(--text-3)}
.txt{display:block;margin:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere;max-width:75ch}
.txtbtn{all:unset;box-sizing:border-box;display:grid;gap:2px;align-content:start;width:100%;min-height:36px;cursor:pointer;border-radius:var(--radius-sm)}
.txtbtn .txt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.txtbtn.l3 .txt{-webkit-line-clamp:3;line-clamp:3}
.txtbtn[aria-expanded=true] .txt{display:block;overflow:visible}
.txtbtn .hint{font-size:12px;color:var(--accent-text)}
.txtbtn:hover .hint{text-decoration:underline}
.txtbtn:disabled{cursor:default;min-height:0}
.txtbtn:disabled .hint{display:none}
.txtbtn:focus-visible,.more:focus-visible,.docs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:var(--radius-sm);border:1px dashed var(--line);background:transparent;color:var(--text-2);cursor:pointer;font-size:13px;transition:border-color .15s var(--ease),color .15s var(--ease)}
.more:hover{border-color:var(--accent);color:var(--text)}
.more.block{display:flex;width:100%;margin-top:var(--space-md)}
.more.fmore{font-family:var(--font-mono);font-size:12px}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file{font-family:var(--font-mono);font-size:12px;background:var(--bg);padding:2px 6px;border-radius:var(--radius-sm);color:var(--text-2);overflow-wrap:anywhere;max-width:100%}

/* deliverables */
.list.dl{gap:var(--space-lg)}
.deliv{display:grid;gap:var(--space-sm);padding-bottom:var(--space-lg);border-bottom:1px solid var(--line)}
.deliv:last-child{border:0;padding-bottom:0}
.deliv:first-child>.txtbtn .txt,.deliv:first-child>.txt{font-weight:600}
.deliv-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);font-size:12px;color:var(--text-3)}

/* activity timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-lg)}
.tl h3.day{margin:0 0 var(--space-sm);font-family:var(--font-body);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.evs{list-style:none;margin:0;padding:0}
.ev{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);gap:var(--space-md);padding-bottom:var(--space-xs)}
.ev::before{content:"";position:absolute;left:9.5px;top:0;bottom:0;width:1px;background:var(--line)}
.ev:first-child::before{top:14px}
.ev:last-child::before{bottom:calc(100% - 14px)}

    if (ds.shot != null) {
      if (el.closest(".lb")) { state.ui.lightbox.file = ds.shot; state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); }
      else openShot(ds.shot, el.getAttribute("data-fid"));
      return;
    }
    if (ds.jump != null) { jumpToTask(ds.jump); return; }
    if (ds.more) { var flag = ds.more + "All"; state.ui[flag] = !state.ui[flag]; state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); return; }
    if (ds.grp) {
      var m = isFiltering() ? state.ui.grpF : state.ui.grp; m[ds.grp] = el.getAttribute("aria-expanded") !== "true";
      state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); return;
    }
    if (ds.expand) { state.ui.open[ds.expand] = !state.ui.open[ds.expand]; state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); return; }
    if (ds.clearq) { state.filters.q = ""; searchEl.value = ""; persist(); render(window.DASHBOARD); return; }
    if (ds.clear) { state.filters = { q: "", status: [], kind: [], phase: [] }; searchEl.value = ""; persist(); render(window.DASHBOARD); return; }
    if (ds.f) {
      toggle(state.filters[ds.f], ds.v); persist();
      state.fid = "f:" + ds.f + ":" + ds.v;
      render(window.DASHBOARD); return;
    }
    /* phase cards only select the phase shown in Phase detail: no filtering, no scrolling */
    if (ds.phase) { state.selPhase = state.selPhase === String(ds.phase) ? null : String(ds.phase); state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); return; }
    if (ds.task) { var id = ds.task; state.expanded[id] = !state.expanded[id]; var row = el.closest(".task"); row.classList.toggle("open", !!state.expanded[id]); el.setAttribute("aria-expanded", !!state.expanded[id]); }
  });
  function focusables(root) {
    return Array.prototype.filter.call(root.querySelectorAll('button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])'), function (n) { return n.offsetParent !== null || n === document.activeElement; });
  }
  /* capture phase: the viewer owns the keyboard while open; role=button spans activate on Enter/Space */
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute("role") === "button" && t.getAttribute("data-shot") != null && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault(); e.stopPropagation(); openShot(t.getAttribute("data-shot"), t.getAttribute("data-fid")); return;
    }
    if (!state.ui.lightbox || e.metaKey || e.ctrlKey || e.altKey) return;
    var fid = activeFid(), k = e.key;
    if (k === "Tab") {
      var root = document.querySelector(".lb"), f = root ? focusables(root) : [];
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      return;
    }
    if (k === "Escape") { e.preventDefault(); closeShot(); }
    else if (k === "ArrowLeft") { e.preventDefault(); stepShot(-1, false, fid); }
    else if (k === "ArrowRight") { e.preventDefault(); stepShot(1, false, fid); }
    else if (k === "PageUp") { e.preventDefault(); stepShot(-1, true, fid); }
    else if (k === "PageDown") { e.preventDefault(); stepShot(1, true, fid); }
    else if (k === "Home") { e.preventDefault(); jumpShot(false, fid); }
    else if (k === "End") { e.preventDefault(); jumpShot(true, fid); }
    else if (k === "z" || k === "Z") { e.preventDefault(); state.ui.lightbox.zoom = !state.ui.lightbox.zoom; state.fid = fid; render(window.DASHBOARD); }
  }, true);
  /* aspect ratio drives the viewer sizing; set in place so no re-render is needed */
  document.addEventListener("load", function (e) {
    var im = e.target;
    if (!im || !im.classList || !im.classList.contains("lb-img") || !im.naturalWidth) return;
    var ar = im.naturalWidth / im.naturalHeight;
    state.ar[im.getAttribute("data-file")] = ar;
    var g = document.querySelector(".lb-group");
    if (g) g.style.setProperty("--ar", ar);
  }, true);
  document.addEventListener("error", function (e) {
    var im = e.target;
    if (!im || im.tagName !== "IMG") return;
    var f = im.getAttribute("data-file");
    if (!f) return;
    if (im.classList.contains("filmimg")) { im.style.display = "none"; return; }
    state.broken[f] = true;
    var lbl = document.createElement("span");
    lbl.className = im.classList.contains("lb-img") ? "lb-miss" : "shotmiss";
    lbl.textContent = "Image missing";
    im.replaceWith(lbl);
  }, true);
  /* legend chip <-> annotation box highlight, in place */
  function hl(e, on) {
    var li = e.target.closest && e.target.closest(".lb-anns li");
    if (!li) return;
    var box = document.querySelector('.lb .ann[data-ai="' + li.getAttribute("data-ai") + '"]');
    if (box) box.classList.toggle("hl", on);
  }
  document.addEventListener("mouseover", function (e) { hl(e, true); });
  document.addEventListener("mouseout", function (e) { hl(e, false); });
  document.addEventListener("focusin", function (e) { hl(e, true); });
  document.addEventListener("focusout", function (e) { hl(e, false); });
  window.addEventListener("hashchange", function () {
    var f = hashFile(), d = window.DASHBOARD;
    if (!d) return;
    if (f && lbIndex(allShots(d), f) >= 0 && (!state.ui.lightbox || state.ui.lightbox.file !== f)) { state.ui.lightbox = { file: f, zoom: false }; state.fid = "lb:close"; render(d); }
    else if (!f && state.ui.lightbox) { state.ui.lightbox = null; render(d); }
  });
  window.addEventListener("resize", fitClamps);

  /* ---------- refresh: swap the data.js script tag, re-render, no page reload ---------- */
  function loadData() {
    var old = document.getElementById("data-script");
    if (old) old.remove();
    var s = document.createElement("script");
    s.id = "data-script";
    s.src = "data.js?t=" + Date.now();
    s.onload = s.onerror = renderIfChanged;
    document.head.appendChild(s);
  }
  var lastSnapshot = null;
  function renderIfChanged() {
    var d = window.DASHBOARD;
    var snap = d ? JSON.stringify(d) + isStalled(d) : "";
    if (snap === lastSnapshot) return;
    lastSnapshot = snap;
    render(window.DASHBOARD);
  }
  function tickTimes() {
    var els = document.querySelectorAll("time[datetime]");
    for (var i = 0; i < els.length; i++) els[i].textContent = ago(els[i].getAttribute("datetime"));
    renderIfChanged();
  }
  loadData();
  setInterval(loadData, REFRESH_MS);
  setInterval(tickTimes, TICK_MS);
})();
</script>
</body>
