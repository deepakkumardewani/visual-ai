<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dodo Payments migration · Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        /* surfaces tinted toward indigo hue 275 */
        --bg: oklch(0.17 0.012 275);
        --surface: oklch(0.21 0.014 275);
        --surface-2: oklch(0.25 0.016 275);
        --line: oklch(0.34 0.02 275);
        --text: oklch(0.95 0.006 275);
        --text-2: oklch(0.78 0.015 275);
        --text-3: oklch(0.68 0.02 275);
        --accent: oklch(0.68 0.17 277);
        --accent-ink: oklch(0.16 0.03 277);
        --accent-soft: oklch(0.3 0.07 277);
        --accent-text: oklch(0.82 0.1 277);
        --s-verified: oklch(0.78 0.15 155);
        --s-built: oklch(0.82 0.13 85);
        --s-verifying: oklch(0.8 0.11 215);
        --s-building: oklch(0.8 0.12 250);
        --s-queued: oklch(0.76 0.03 275);
        --s-ready: oklch(0.82 0.08 185);
        --s-waiting: oklch(0.66 0.025 275);
        --s-failed: oklch(0.74 0.17 25);
        --s-blocked: oklch(0.76 0.15 55);
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 12px;
        --space-lg: 16px;
        --space-xl: 24px;
        --space-2xl: 32px;
        --space-3xl: 48px;
        --radius: 8px;
        --radius-sm: 4px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --font-body: 'Schibsted Grotesk', system-ui, sans-serif;
        --font-display: 'Bricolage Grotesque', 'Schibsted Grotesk', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 15px/1.55 var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--accent-text);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: -999px;
        top: 0;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 8px 12px;
        z-index: 100;
      }
      .skip:focus {
        left: 8px;
        top: 8px;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--space-xl) var(--space-lg) var(--space-3xl);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .muted {
        color: var(--text-2);
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 32px;
        line-height: 1.15;
        text-wrap: balance;
      }
      h2 {
        font-size: 18px;
        line-height: 1.3;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
      }

      /* header */
      header.top {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--space-md) var(--space-lg);
        align-items: end;
        margin-bottom: var(--space-lg);
      }
      .top-meta {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        align-items: center;
        justify-content: flex-end;
      }
      .updated {
        font-size: 13px;
        color: var(--text-3);
      }
      .stalled {
        display: inline-block;
        margin-left: var(--space-sm);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        background: oklch(0.3 0.07 55);
        color: var(--s-blocked);
        font-weight: 600;
        font-size: 12px;
      }
      .progress {
        grid-column: 1/-1;
        display: grid;
        gap: var(--space-sm);
      }
      .prog-head {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--space-xs) var(--space-sm);
        color: var(--text-2);
        font-size: 14px;
      }
      .prog-head .pct {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        color: var(--text);
      }
      .prog-head .sep {
        color: var(--text-3);
      }
      .progress .bar {
        height: 10px;
      }
      .bar {
        background: var(--surface-2);
        border-radius: 99px;
        overflow: hidden;
        display: flex;
        height: 8px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--s-verified);
        transition: width 0.3s var(--ease);
      }
      .bar > i.b,
      .sw.b {
        background: repeating-linear-gradient(
          135deg,
          var(--s-built) 0 3px,
          color-mix(in oklch, var(--s-built) 22%, var(--surface-2)) 3px 6px
        );
      }
      .bar > i.a {
        background: var(--accent);
      }
      .bar > i.x {
        background: var(--s-failed);
      }
      .bar.sm {
        height: 6px;
      }
      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs) var(--space-lg);
        font-size: 13px;
        color: var(--text-2);
      }
      .legend li {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend b {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .sw {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--s-verified);
      }
      .sw.a {
        background: var(--accent);
      }
      .sw.x {
        background: var(--s-failed);
      }
      .sw.r {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      /* constraint banner: compact, rule first, scope second */
      .constraint {
        display: flex;
        gap: var(--space-sm);
        align-items: flex-start;
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        border-radius: var(--radius);
        margin-bottom: var(--space-lg);
      }
      .constraint svg {
        flex: none;
        margin-top: 3px;
      }
      .constraint .cbody {
        display: grid;
        gap: 2px;
      }
      .constraint p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-2);
        max-width: 80ch;
        font-variant-numeric: tabular-nums;
      }
      .constraint strong {
        color: var(--text);
      }

      /* panels */
      section.panel {
        margin-top: var(--space-2xl);
      }
      .panel-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-md);
        margin-bottom: var(--space-md);
        flex-wrap: wrap;
      }
      .count {
        font-size: 13px;
        color: var(--text-3);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: var(--space-lg);
      }

      /* status pill: 11px caps, 4px radius, no border; icon + text so color is not alone */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        background: color-mix(in oklch, var(--c) 18%, var(--surface));
        color: var(--c);
        white-space: nowrap;
      }
      .pill svg {
        width: 11px;
        height: 11px;
        flex: none;
      }
      .pill.long {
        white-space: normal;
        line-height: 1.25;
      }
      .pill.built {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--c);
      }
      .pill.built svg {
        stroke-dasharray: 2 2;
      }
      .st-verified {
        --c: var(--s-verified);
      }
      .st-built {
        --c: var(--s-built);
      }
      .st-verifying {
        --c: var(--s-verifying);
      }
      .st-building {
        --c: var(--s-building);
      }
      .st-queued {
        --c: var(--s-queued);
      }
      .st-ready {
        --c: var(--s-ready);
      }
      .st-waiting {
        --c: var(--s-waiting);
      }
      .st-failed {
        --c: var(--s-failed);
      }
      .st-blocked {
        --c: var(--s-blocked);
      }
      .st-accent {
        --c: var(--accent-text);
      }
      .st-muted {
        --c: var(--text-3);
      }

      /* buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--surface-2);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .btn:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .btn:active {
        background: var(--accent);
      }
      .btn.copied {
        border-color: var(--s-verified);
        color: var(--s-verified);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--accent-text);
      }
      .btn.quiet:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .push {
        margin-left: auto;
      }

      /* now */
      .now-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-md);
      }
      .now-head h3 {
        font-size: 16px;
      }
      .now-name {
        font-size: 14px;
        color: var(--text-2);
      }
      .now-meta {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-md);
        font-size: 13px;
        color: var(--text-2);
      }
      .att {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pips {
        display: inline-flex;
        gap: 3px;
      }
      .pips i {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .pips i.on {
        background: var(--accent);
        box-shadow: none;
      }
      .pips.last i.on {
        background: var(--s-failed);
      }
      /* subgrid: pill and id columns size to the widest label and stay aligned across rows */
      .now ul {
        list-style: none;
        margin: var(--space-md) 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr);
        gap: 6px var(--space-sm);
      }
      .now li {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1/-1;
        align-items: center;
        font-size: 14px;
      }
      .now li .pill {
        justify-self: start;
      }
      .now-idle {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-sm);
      }
      .now-idle .cmd {
        flex: 1 1 280px;
        margin: 0;
      }
      .cmd {
        display: flex;
        gap: var(--space-sm);
        align-items: center;
        flex-wrap: wrap;
        margin-top: var(--space-sm);
      }
      .cmd code {
        flex: 1 1 220px;
        min-width: 0;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        font-family: var(--font-mono);
        font-size: 13px;
      }

      /* gate track: the release checkpoints (gate / walkthrough / definition of done), in task order */
      .gates {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--space-sm);
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .gstep {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 2px var(--space-md);
        align-content: start;
        padding: var(--space-md);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        transition:
          border-color 0.15s var(--ease),
          background 0.15s var(--ease);
      }
      .gstep:hover {
        border-color: color-mix(in oklch, var(--accent) 55%, var(--line));
        background: var(--surface-2);
      }
      .gstep:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .gstep.st-failed,
      .gstep.st-blocked {
        border-color: var(--c);
        background: color-mix(in oklch, var(--c) 9%, var(--surface));
      }
      .gnum {
        grid-row: 1 / span 3;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 500;
        color: var(--c);
        background: color-mix(in oklch, var(--c) 16%, var(--surface));
      }
      .gstep.st-verified .gnum {
        background: var(--c);
        color: var(--accent-ink);
      }
      .gkind {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
      }
      .gtitle {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.35;
      }
      .gfoot {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs) var(--space-sm);
        align-items: center;
        margin-top: var(--space-xs);
        font-size: 12px;
        color: var(--text-3);
      }
      .gfoot .mono {
        font-size: 12px;
        color: var(--accent-text);
      }

      /* phases: compact cards; double as task filters */
      .phases {
        display: grid;
        gap: var(--space-sm);
        grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      }
      @media (min-width: 720px) {
        .phases {
          grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        }
      }
      .phase {
        display: grid;
        gap: var(--space-sm);
        align-content: start;
        text-align: left;
        cursor: pointer;
        width: 100%;
        min-height: 44px;
        padding: var(--space-md);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        transition:
          border-color 0.15s var(--ease),
          background 0.15s var(--ease);
      }
      .phase:hover {
        border-color: color-mix(in oklch, var(--accent) 55%, var(--line));
      }
      .phase[aria-pressed='true'] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        background: color-mix(in oklch, var(--accent) 14%, var(--surface));
      }
      .phase[aria-pressed='true'] .pid {
        color: var(--accent-text);
      }
      .ptop {
        display: flex;
        gap: 6px;
        align-items: baseline;
        min-width: 0;
      }
      .pid {
        flex: none;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
      }
      /* always two lines tall so progress bars and meta align across cards */
      .pname {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        font-size: 14px;
        line-height: 1.3;
        min-height: 2.6em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .ptop {
        align-items: flex-start;
      }
      .pid {
        padding-top: 2px;
      }
      .nowtag {
        flex: none;
        margin-top: 1px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent-text);
      }
      .nowtag i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .gate {
        flex: none;
        display: inline-flex;
        align-self: center;
        color: var(--s-verified);
      }
      .pmeta {
        display: flex;
        flex-wrap: wrap;
        gap: 2px var(--space-md);
        font-size: 12px;
        color: var(--text-2);
      }
      .pmeta b {
        color: var(--text);
        font-weight: 600;
      }
      .pmeta .pb {
        color: var(--s-built);
      }
      .pmeta .pa {
        color: var(--accent-text);
      }
      .pmeta .pbad {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-weight: 600;
        color: var(--c);
      }
      .pmeta .pbad svg {
        width: 11px;
        height: 11px;
      }

      /* phase detail: what the phase adds, how to see it, what its checkpoint proves */
      .pd-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--space-xs) var(--space-md);
        margin-bottom: var(--space-md);
      }
      .pd-head h2 .pid {
        font-size: 15px;
        color: var(--accent-text);
        margin-right: 6px;
      }
      .pd {
        display: grid;
        gap: var(--space-lg) var(--space-xl);
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      }
      .pd .kv {
        gap: 6px;
        align-content: start;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .pd .kv > span:first-child,
      .task .kv > span:first-child {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .pd p {
        margin: 0;
      }
      .steps,
      .blist {
        margin: 0;
        padding-left: 20px;
        display: grid;
        gap: 6px;
      }
      .steps li::marker {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent-text);
      }
      .blist li::marker {
        color: var(--text-3);
      }
      .pd-sub {
        font-size: 13px;
        color: var(--text-3);
      }
      .none {
        color: var(--text-3);
        font-style: italic;
      }

      /* attention panels */
      .attn {
        border: 1px solid var(--s-failed);
        background: color-mix(in oklch, var(--s-failed) 10%, var(--surface));
      }
      .stuckitem + .stuckitem {
        margin-top: var(--space-md);
      }
      .kv {
        display: grid;
        gap: 2px;
        font-size: 14px;
      }
      .kv > span:first-child {
        font-size: 12px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .stuckitem {
        padding: var(--space-md);
        background: var(--bg);
        border-radius: var(--radius-sm);
        display: grid;
        gap: var(--space-xs);
      }

      /* questions: one bordered list, divided rows */
      .id {
        font-family: var(--font-mono);
        color: var(--accent-text);
        font-weight: 500;
      }
      .panel-head.qhead {
        align-items: center;
      }
      .qctl {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-sm);
      }
      .count.qbadge {
        padding: 1px 8px;
        border-radius: 99px;
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }
      .qlist {
        border: 1px solid var(--accent);
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .qrow {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: var(--space-sm);
        align-items: start;
        padding-right: var(--space-md);
      }
      .qrow + .qrow {
        border-top: 1px solid var(--line);
      }
      .qrow.open {
        background: color-mix(in oklch, var(--accent-soft) 35%, var(--surface));
      }
      .qtoggle {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: var(--space-sm);
        align-items: start;
        min-height: 56px;
        padding: var(--space-md) 0 var(--space-md) var(--space-md);
      }
      .qtoggle:hover {
        background: var(--surface-2);
      }
      .qtoggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .qchev {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-top: 1px;
        color: var(--text-3);
        transition: transform 0.2s var(--ease);
      }
      .qtoggle[aria-expanded='true'] .qchev {
        transform: rotate(90deg);
      }
      .qmain {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .qmeta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--space-xs) var(--space-sm);
        font-size: 12px;
        color: var(--text-3);
      }
      .qmeta .id {
        font-size: 13px;
      }
      .qtext {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
        font-size: 14px;
      }
      .qrow.open .qtext {
        display: block;
        -webkit-line-clamp: unset;
        line-clamp: unset;
      }
      .qact {
        display: flex;
        gap: var(--space-sm);
        align-items: center;
        align-self: start;
        padding: 10px 0;
      }
      .qdetail {
        grid-column: 1/-1;
        display: grid;
        gap: var(--space-sm);
        padding: 0 0 var(--space-md) calc(var(--space-md) + 20px + var(--space-sm));
      }
      .qdetail[hidden] {
        display: none;
      }
      .qhint {
        margin: 0;
        font-size: 13px;
        color: var(--text-3);
      }
      .qdonebar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-sm);
        margin-top: var(--space-sm);
        font-size: 13px;
      }
      /* ghost button: pull back by its padding so its text lines up with the list edge */
      .qdonebar > .btn.quiet:first-child {
        margin-inline-start: calc(-1 * var(--space-md));
      }
      .qdonelist {
        list-style: none;
        margin: var(--space-xs) 0 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .qdonelist li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--space-sm);
        align-items: center;
        padding: var(--space-sm) var(--space-md);
      }
      .qdonelist li + li {
        border-top: 1px solid var(--line);
      }
      .qdonelist .qclamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 1;
        line-clamp: 1;
        overflow: hidden;
        overflow-wrap: anywhere;
        font-size: 14px;
      }
      .qdonelist .sub {
        font-size: 12px;
        color: var(--text-3);
      }
      .qempty {
        margin: 0;
        padding: var(--space-md);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        color: var(--text-2);
        font-size: 14px;
      }

      /* feed: deliverables | activity */
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--space-md);
      }
      .feed {
        display: grid;
        gap: var(--space-2xl);
        margin-top: var(--space-2xl);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
      .feed > section.panel {
        margin-top: 0;
        min-width: 0;
      }
      @media (min-width: 1000px) {
        .feed {
          grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        }
      }
      .feed-empty {
        margin: 0;
        color: var(--text-2);
        font-size: 14px;
      }
      .feed-empty span {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        color: var(--text-3);
      }

      /* shared bits */
      .tag {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.4;
        padding: 1px 6px;
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--accent-text);
        white-space: nowrap;
      }
      .tag.more-tag {
        color: var(--text-3);
      }
      .txt {
        display: block;
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        max-width: 75ch;
      }
      .txtbtn {
        all: unset;
        box-sizing: border-box;
        display: grid;
        gap: 2px;
        align-content: start;
        width: 100%;
        min-height: 36px;
        cursor: pointer;
        border-radius: var(--radius-sm);
      }
      .txtbtn .txt {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .txtbtn.l3 .txt {
        -webkit-line-clamp: 3;
        line-clamp: 3;
      }
      .txtbtn[aria-expanded='true'] .txt {
        display: block;
        overflow: visible;
      }
      .txtbtn .hint {
        font-size: 12px;
        color: var(--accent-text);
      }
      .txtbtn:hover .hint {
        text-decoration: underline;
      }
      .txtbtn:disabled {
        cursor: default;
        min-height: 0;
      }
      .txtbtn:disabled .hint {
        display: none;
      }
      .txtbtn:focus-visible,
      .more:focus-visible,
      .docs a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .more {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 4px 12px;
        border-radius: var(--radius-sm);
        border: 1px dashed var(--line);
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        font-size: 13px;
        transition:
          border-color 0.15s var(--ease),
          color 0.15s var(--ease);
      }
      .more:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .more.block {
        display: flex;
        width: 100%;
        margin-top: var(--space-md);
      }
      .more.fmore {
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .files {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .file {
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--bg);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        color: var(--text-2);
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      .fnote {
        font-size: 13px;
        color: var(--text-3);
        font-style: italic;
      }

      /* deliverables */
      .list.dl {
        gap: var(--space-lg);
      }
      .deliv {
        display: grid;
        gap: var(--space-sm);
        padding-bottom: var(--space-lg);
        border-bottom: 1px solid var(--line);
      }
      .deliv:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .deliv .txt {
        color: var(--text);
      }
      .deliv:first-child > .txtbtn .txt,
      .deliv:first-child > .txt {
        font-weight: 600;
      }
      .deliv-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-sm);
        font-size: 12px;
        color: var(--text-3);
      }

      /* activity timeline */
      .tl {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--space-lg);
      }
      .tl h3.day {
        margin: 0 0 var(--space-sm);
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-3);
      }
      .evs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .ev {
        position: relative;
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        gap: var(--space-md);
        padding-bottom: var(--space-xs);
      }
      .ev::before {
        content: '';
        position: absolute;
        left: 9.5px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }
      .ev:first-child::before {
        top: 14px;
      }
      .ev:last-child::before {
        bottom: calc(100% - 14px);
      }
      .ev-dot {
        position: relative;
        z-index: 1;
        margin-top: 5px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in oklch, var(--c) 22%, var(--surface));
        color: var(--c);
      }
      .ev-dot svg {
        width: 12px;
        height: 12px;
      }
      .ev.dashed .ev-dot {
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--c);
      }
      .ev.dashed .ev-dot svg {
        stroke-dasharray: 2 2;
      }
      .ev-body {
        display: grid;
        gap: 2px;
        min-width: 0;
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-sm);
      }
      .ev.tint .ev-body {
        background: color-mix(in oklch, var(--c) 11%, var(--surface));
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--c) 40%, transparent);
      }
      .ev-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-sm);
        font-size: 13px;
        min-height: 22px;
      }
      .ev-label {
        font-weight: 600;
        color: var(--c);
      }
      .ev-head time {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
      }
      .ev .txt {
        color: var(--text-2);
      }
      .ev.tint .txt {
        color: var(--text);
      }

      /* commits: one card per phase group, divided rows (never a card per commit) */
      .cgrid {
        display: grid;
        gap: var(--space-lg);
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
        align-items: start;
      }
      .cgroup {
        min-width: 0;
      }
      .cgroup > h3 {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px var(--space-md);
        margin: 0 0 var(--space-sm);
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
      }
      .cgroup > h3 .ghc {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .cms {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
      }
      .cm {
        display: grid;
        gap: var(--space-xs);
        padding: var(--space-md) 0;
      }
      .cm:first-child:not(.fail) {
        padding-top: 0;
      }
      .cm:last-child:not(.fail) {
        padding-bottom: 0;
      }
      .cm + .cm {
        border-top: 1px solid var(--line);
      }
      .cm.fail {
        padding-inline: var(--space-sm);
        border-radius: var(--radius-sm);
        background: color-mix(in oklch, var(--s-failed) 10%, var(--surface));
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--s-failed) 40%, transparent);
      }
      .cm-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-sm);
        font-size: 12px;
        color: var(--text-3);
      }
      .cm-head time {
        margin-left: auto;
        white-space: nowrap;
      }
      a.tag {
        text-decoration: none;
      }
      a.tag:hover {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a.tag:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .cm-head .mono {
        font-size: 12px;
        color: var(--text-2);
      }
      .cm-subj {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        line-height: 1.45;
        overflow-wrap: anywhere;
        max-width: 75ch;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .cm-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-md);
        font-size: 12px;
        color: var(--text-2);
      }
      .cm-meta .mono {
        font-size: 12px;
      }
      .cm-meta .add {
        color: var(--s-verified);
      }
      .cm-meta .del {
        color: var(--s-failed);
      }
      .cm-note {
        margin: 0;
        font-size: 12px;
        color: var(--text-3);
        overflow-wrap: anywhere;
        max-width: 80ch;
      }
      .cm-err {
        margin: 0;
        font-size: 13px;
        color: var(--text);
        overflow-wrap: anywhere;
        max-width: 80ch;
      }
      .cm-err b {
        color: var(--s-failed);
        font-weight: 600;
      }

      /* tasks: toolbar */
      .tb {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-md) var(--space-xl);
        align-items: center;
        margin-bottom: var(--space-sm);
      }
      .fbar {
        display: contents;
      }
      .search {
        flex: 0 1 320px;
        min-width: 0;
        min-height: 44px;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .search::placeholder {
        color: var(--text-3);
      }
      .fgroup {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .fgroup .lbl {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-right: 2px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 3px 10px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        transition:
          background 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .chip:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .chip[aria-pressed='true'] {
        background: color-mix(in oklch, var(--accent) 22%, var(--surface));
        border-color: var(--accent);
        color: var(--text);
      }
      .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
        flex: none;
      }
      .chip .n {
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .chip.ph {
        min-width: 36px;
        justify-content: center;
        padding-inline: 8px;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .sum {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        align-items: center;
        min-height: 32px;
        font-size: 13px;
        color: var(--text-2);
      }
      .tok {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 3px 8px 3px 12px;
        border-radius: 99px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
        background: color-mix(in oklch, var(--accent) 14%, var(--surface));
        border: 1px solid color-mix(in oklch, var(--accent) 55%, var(--line));
      }
      .tok:hover {
        border-color: var(--accent);
      }
      .tok svg {
        width: 12px;
        height: 12px;
        flex: none;
      }
      .linkbtn {
        min-height: 32px;
        padding: 0 var(--space-sm);
        background: none;
        border: 0;
        cursor: pointer;
        font-size: 13px;
        color: var(--accent-text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .linkbtn:hover {
        color: var(--text);
      }

      /* tasks: groups and rows */
      .phgroup {
        margin-top: var(--space-xl);
      }
      .phgroup > h3 {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px var(--space-md);
        margin-bottom: var(--space-sm);
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
      }
      .phgroup .ghc {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .phgroup .ghc .gb {
        color: var(--s-built);
      }
      .trows {
        display: grid;
        gap: 6px;
      }
      .task {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        transition: border-color 0.15s var(--ease);
      }
      .task.open {
        border-color: color-mix(in oklch, var(--accent) 45%, var(--line));
        background: color-mix(in oklch, var(--accent) 4%, var(--surface));
      }
      .task > button {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: grid;
        width: 100%;
        min-height: 48px;
        padding: var(--space-sm) var(--space-lg) var(--space-sm) var(--space-md);
        gap: 2px var(--space-md);
        align-items: center;
        border-radius: var(--radius);
        grid-template-columns: 16px 52px minmax(0, 1fr) auto auto;
        grid-template-areas: 'chev tid tt meta stat';
      }
      .task > button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .task:not(.open) > button:hover {
        background: var(--surface-2);
      }
      .task.open > button {
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .task.open > button:hover {
        background: color-mix(in oklch, var(--surface-2) 40%, transparent);
      }
      .task .chev {
        grid-area: chev;
        color: var(--text-3);
        transition: transform 0.2s var(--ease);
      }
      .task.open .chev {
        transform: rotate(90deg);
        color: var(--accent-text);
      }
      .task .tid {
        grid-area: tid;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--accent-text);
      }
      .task .tt {
        grid-area: tt;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .task .meta {
        grid-area: meta;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        align-items: center;
        justify-content: flex-end;
      }
      .task .stat {
        grid-area: stat;
        justify-self: end;
      }
      .ktag {
        font-size: 11px;
        line-height: 1.5;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        color: var(--text-3);
        white-space: nowrap;
      }
      .ktag.k-gate,
      .ktag.k-walkthrough,
      .ktag.k-dod {
        border-color: color-mix(in oklch, var(--accent) 55%, var(--line));
        color: var(--accent-text);
      }
      .cnt {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
      }
      .task .detail {
        display: none;
        margin: 0 var(--space-lg) 0 var(--space-md);
        padding: var(--space-md) 0 var(--space-lg);
        border-top: 1px solid var(--line);
        gap: var(--space-md) var(--space-xl);
        grid-template-columns: minmax(0, 1fr);
      }
      .task.open .detail {
        display: grid;
      }
      @media (min-width: 720px) {
        .task .detail {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .task .detail .wide {
          grid-column: 1/-1;
        }
      }
      /* align-content:start stops a taller sibling cell from stretching label rows */
      .task .kv {
        gap: 6px;
        align-content: start;
        min-width: 0;
      }
      .task .kv .txt {
        max-width: none;
      }
      /* commands: monospace block + copy; long ones clamp to ~2 lines until expanded */
      .cmds {
        display: grid;
        gap: var(--space-sm);
      }
      .cmdrow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--space-sm);
        align-items: start;
      }
      .cmdbox {
        min-width: 0;
        display: grid;
        gap: 4px;
        justify-items: start;
      }
      .cmdtext {
        margin: 0;
        width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text);
      }
      .cmdtext.clamped {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .task .stamp {
        font-size: 12px;
        color: var(--text-3);
      }
      .deps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .dep {

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }

  </head>
  <body>
    <a class="skip" href="#tasks">Skip to all tasks</a>
    <div class="wrap">
      <div id="fatal" class="empty" role="alert"></div>
      <div id="app" aria-live="off">
        <p class="loading">Loading dashboard data…</p>
      </div>
    </div>

    <script>
      (function () {
        'use strict';
        var SLUG = 'tasks_dodo_payments';
        var REFRESH_MS = 10000,
          TICK_MS = 30000,
          STALL_MS = 10 * 60 * 1000,
          LS_KEY = 'dashboard:' + SLUG + ':filters',
          LS_Q = 'dashboard:' + SLUG + ':questions';
        var SYNC_CMD =
          'node ~/.claude/scripts/dashboard.mjs sync /Users/deepakdewani1/Documents/Programs/vue/text-to-image/visual-ai/agent_docs/TASKS_dodo_payments.md';
        var STATUSES = [
          'verified',
          'built',
          'verifying',
          'building',
          'queued',
          'failed',
          'blocked',
          'ready',
          'waiting',
        ];
        var ICONS = {
          verified: '<path d="M3 8.5l3.2 3L13 4.5"/>',
          built: '<path d="M3 8.5l3.2 3L13 4.5"/>',
          verifying: '<circle cx="8" cy="8" r="4.5"/><path d="M8 5v3l2 1"/>',
          building: '<path d="M3 13l6-6M9 4l3 3-2 2-3-3z"/>',
          queued: '<path d="M3 5h10M3 8h10M3 11h6"/>',
          ready: '<path d="M5 3l8 5-8 5z"/>',
          waiting: '<circle cx="8" cy="8" r="5"/><path d="M8 5v3"/>',
          failed: '<path d="M4 4l8 8M12 4l-8 8"/>',
          blocked: '<circle cx="8" cy="8" r="5"/><path d="M4.5 11.5l7-7"/>',
        };
        var ACTIVE_ST = ['building', 'verifying'];
        /* raw kind stays the filter value; the label is what people read */
        var KIND_LABEL = {
          implementation: 'implementation',
          unit: 'unit test',
          e2e: 'e2e',
          gate: 'gate',
          walkthrough: 'walkthrough',
          dod: 'definition of done',
        };
        var GATE_KINDS = ['gate', 'walkthrough', 'dod'];
        /* not-started states: the gate track shows a pill only once something has happened */
        var QUIET_ST = ['ready', 'queued', 'waiting'];
        var GATE_PREFIX = /^[A-Z][A-Z ]+:\s*/;
        /* a sign-off is a gate that waits on a person; this TASKS file has none yet, the convention matches the sibling dashboards */
        var SIGNOFF_RE = /^SIGN-OFF:\s*/i;
        var CHECK_EVENT_LABEL = {
          build_started: 'Checks started',
          task_started: 'Checks started',
          task_built: 'Checks passed',
        };
        var PILL_LONG_CHARS = 16,
          CMD_LONG_CHARS = 140,
          CMD_LONG_LINES = 2;
        /* TASKS lists placeholders like "none (external account)" in Files; they are notes, not files */
        var NONE_FILE = /^none\b/i;
        var ACT_CAP = 12,
          DEL_CAP = 4,
          COMMIT_CAP = 3,
          FILES_CAP = 3,
          TAGS_CAP = 4,
          CLAMP_MIN_CHARS = 60,
          MS_PER_DAY = 86400000,
          COPIED_MS = 1500;
        /* fid = id of the control that should hold focus after the next render; fid is consumed by render() */
        var state = {
          filters: { q: '', status: [], kind: [], phase: [] },
          expanded: {},
          copied: {},
          fid: null,
          q: { done: {}, open: {}, showDone: false, panelOpen: false },
          ui: { delAll: false, actAll: false, open: {} },
        };
        try {
          var saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
          if (saved) {
            state.filters = Object.assign(state.filters, saved);
          }
        } catch (e) {
          console.warn('filters not restored', e);
        }
        try {
          var savedQ = JSON.parse(localStorage.getItem(LS_Q) || 'null');
          if (savedQ) {
            state.q.done = savedQ.done || {};
            state.q.open = savedQ.open || {};
            state.q.showDone = !!savedQ.showDone;
            state.q.panelOpen = savedQ.panelOpen === true;
          }
        } catch (e) {
          console.warn('question state not restored', e);
        }
        function persist() {
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(state.filters));
          } catch (e) {
            console.warn('filters not saved', e);
          }
        }
        function persistQ() {
          try {
            localStorage.setItem(LS_Q, JSON.stringify(state.q));
          } catch (e) {
            console.warn('question state not saved', e);
          }
        }

        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function ago(iso) {
          if (!iso) return '';
          var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
          if (s < 5) return 'just now';
          if (s < 60) return s + 's ago';
          if (s < 3600) return Math.round(s / 60) + ' min ago';
          if (s < 86400) return Math.round(s / 3600) + ' h ago';
          return Math.round(s / 86400) + ' d ago';
        }
        function when(iso) {
          return iso
            ? '<time datetime="' +
                esc(iso) +
                '" title="' +
                esc(new Date(iso).toLocaleString()) +
                '">' +
                ago(iso) +
                '</time>'
            : '';
        }
        function icon(st, size) {
          return (
            '<svg width="' +
            size +
            '" height="' +
            size +
            '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (ICONS[st] || '') +
            '</svg>'
          );
        }
        /* display-only wording: checkpoint tasks run checks, sign-offs wait on a person; status keys and CSS classes stay raw */
        function statusLabel(status, kind, title) {
          if (GATE_KINDS.indexOf(kind) < 0) return status;
          if (SIGNOFF_RE.test(title || ''))
            return status === 'building'
              ? 'Awaiting you'
              : status === 'built'
                ? 'Answered'
                : status;
          return status === 'building'
            ? 'Running checks'
            : status === 'built'
              ? 'Checks passed, unverified'
              : status;
        }
        var taskIdx = { d: null, map: {} };
        function taskById(d, id) {
          if (taskIdx.d !== d) {
            taskIdx = { d: d, map: {} };
            (d.phases || []).forEach(function (p) {
              (p.tasks || []).forEach(function (t) {
                taskIdx.map[t.id] = t;
              });
            });
          }
          return taskIdx.map[id] || null;
        }
        function pill(st, kind, title) {
          var label = statusLabel(st, kind, title),
            long = label.length > PILL_LONG_CHARS;
          return (
            '<span class="pill st-' +
            esc(st) +
            (st === 'built' ? ' built' : '') +
            (long ? ' long' : '') +
            '"' +
            (label !== st ? ' title="' + esc(label) + '"' : '') +
            '><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (ICONS[st] || '') +
            '</svg>' +
            esc(label) +
            '</span>'
          );
        }
        function copyBtn(text, key, label) {
          return (
            '<button class="btn' +
            (state.copied[key] ? ' copied' : '') +
            '" data-copy="' +
            esc(text) +
            '" data-key="' +
            esc(key) +
            '" data-fid="copy:' +
            esc(key) +
            '" aria-label="Copy ' +
            esc(label || text) +
            '">' +
            (state.copied[key] ? 'Copied' : 'Copy') +
            '</button>'
          );
        }
        function isStalled(d) {
          return !!d.current && Date.now() - new Date(d.generatedAt).getTime() > STALL_MS;
        }
        function toggle(list, v) {
          var i = list.indexOf(v);
          if (i < 0) list.push(v);
          else list.splice(i, 1);
        }
        /* keys land in data-* attributes, so keep them [A-Za-z0-9_] */
        function slug(s) {
          return String(s).replace(/[^a-z0-9]+/gi, '_');
        }
        function anyFilter() {
          var f = state.filters;
          return !!(f.q.trim() || f.status.length || f.kind.length || f.phase.length);
        }
        function kindLabel(k) {
          return KIND_LABEL[k] || String(k || '');
        }
        function realFiles(files) {
          return (files || []).filter(function (f) {
            return !NONE_FILE.test(f);
          });
        }
        function fileNotes(files) {
          return (files || []).filter(function (f) {
            return NONE_FILE.test(f);
          });
        }

        var CHEV =
          '<svg class="chev" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg>';
        var X_ICON =
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
        var CHEVRON =
          '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
        var EXT_ICON =
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h4v4M13 3L7.5 8.5M12 9.5V13H3V4h3.5"/></svg>';

        function emptyState() {
          return (
            '<div class="empty"><h2>No dashboard data yet</h2><p>Run this to generate <code>data.js</code>, then this page updates itself:</p>' +
            '<div class="cmd" style="justify-content:center"><code>' +
            esc(SYNC_CMD) +
            '</code>' +
            copyBtn(SYNC_CMD, 'sync', 'sync command') +
            '</div></div>'
          );
        }

        /* ---------- header + constraint ---------- */
        function legendItem(cls, label, n) {
          return (
            '<li><i class="sw ' +
            cls +
            '" aria-hidden="true"></i><span>' +
            esc(label) +
            '</span><b>' +
            n +
            '</b></li>'
          );
        }
        function barSeg(cls, n, tot) {
          return n > 0 && tot
            ? '<i class="' + cls + '" style="width:' + ((n / tot) * 100).toFixed(2) + '%"></i>'
            : '';
        }
        function header(d) {
          var t = d.totals || {},
            by = t.byStatus || {},
            tot = t.tasks || 0;
          var ver = by.verified || 0,
            built = by.built || 0,
            prog = (by.verifying || 0) + (by.building || 0),
            bad = (by.failed || 0) + (by.blocked || 0);
          var rest = Math.max(0, tot - ver - built - prog - bad),
            pct = tot ? Math.round((ver / tot) * 100) : 0;
          var legend =
            legendItem('v', 'Verified', ver) +
            legendItem('b', 'Built or checked, unverified', built) +
            legendItem('a', 'In progress', prog) +
            (bad ? legendItem('x', 'Failed or blocked', bad) : '') +
            legendItem('r', 'Remaining', rest);
          return (
            '<header class="top"><div><div class="eyebrow">Progress dashboard</div><h1>' +
            esc(d.feature && d.feature.title) +
            '</h1></div>' +
            '<div class="top-meta updated">Updated ' +
            when(d.generatedAt) +
            (isStalled(d) ? '<span class="stalled">Possibly stalled</span>' : '') +
            '</div>' +
            '<div class="progress"><p class="prog-head tnum"><span class="pct">' +
            pct +
            '%</span><span>verified</span><span class="sep" aria-hidden="true">·</span><span>' +
            ver +
            ' of ' +
            tot +
            ' tasks</span><span class="sep" aria-hidden="true">·</span><span>' +
            (t.phases || 0) +
            ' phases</span></p>' +
            '<div class="bar" role="progressbar" aria-valuenow="' +
            pct +
            '" aria-valuemin="0" aria-valuemax="100" aria-valuetext="' +
            ver +
            ' of ' +
            tot +
            ' tasks verified" aria-label="Overall progress">' +
            barSeg('v', ver, tot) +
            barSeg('b', built, tot) +
            barSeg('a', prog, tot) +
            barSeg('x', bad, tot) +
            '</div>' +
            '<ul class="legend" aria-label="Task status counts">' +
            legend +
            '</ul></div></header>'
          );
        }
        /* rules from the TASKS header (not task data): test mode only, and the INR gate that halts everything */
        function constraint() {
          return (
            '<div class="constraint" role="note"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--accent-text)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8.5M8 11h.01"/></svg>' +
            '<div class="cbody"><p><strong>Dodo test mode only. INR gate:</strong> if Dodo cannot use INR as a product base currency, work stops and you are asked. No automatic fallback, and no products are created before the gate passes. Secrets are never printed.</p>' +
            '<p>Scope: four one-time INR packs (200 / 450 / 960 / 2000 credits at INR 130 / 290 / 500 / 900). The legacy monthly plan is dropped.</p></div></div>'
          );
        }

        /* ---------- now ---------- */
        function attemptPips(n) {
          var h = '<span class="pips' + (n >= 3 ? ' last' : '') + '" aria-hidden="true">',
            i;
          for (i = 1; i <= 3; i++) h += '<i' + (i <= n ? ' class="on"' : '') + '></i>';
          return h + '</span>';
        }
        function phaseName(d, id) {
          var p = (d.phases || []).filter(function (x) {
            return String(x.id) === String(id);
          })[0];
          return p ? p.name : '';
        }
        function nowRunning(d, c) {
          var n = Number(c.attempt) || 1,
            name = phaseName(d, c.phase);
          return (
            '<div class="now-head"><h3>Phase ' +
            esc(c.phase) +
            '</h3>' +
            (name ? '<span class="now-name">' + esc(name) + '</span>' : '') +
            '<div class="now-meta tnum"><span class="att">' +
            attemptPips(n) +
            '<span>Attempt ' +
            n +
            '/3</span></span>' +
            (c.since ? '<span>Started ' + when(c.since) + '</span>' : '') +
            '</div></div><ul>' +
            (c.tasks || [])
              .map(function (t) {
                var full = taskById(d, t.id) || {};
                return (
                  '<li>' +
                  pill(t.status, t.kind || full.kind, t.title) +
                  '<span class="mono">' +
                  esc(t.id) +
                  '</span><span class="nt">' +
                  esc(t.title) +
                  '</span></li>'
                );
              })
              .join('') +
            '</ul>'
          );
        }
        function now(d) {
          var c = d.current,
            body,
            count;
          if (c) {
            var nt = (c.tasks || []).length;
            body = nowRunning(d, c);
            count = nt + (nt === 1 ? ' task' : ' tasks');
          } else if (d.nextCommand) {
            body =
              '<div class="now-idle"><span class="muted">Nothing running. Next:</span><div class="cmd"><code>' +
              esc(d.nextCommand) +
              '</code>' +
              copyBtn(d.nextCommand, 'next', 'next command') +
              '</div></div>';
            count = 'Idle';
          } else {
            body = '<p style="margin:0">All phases complete.</p>';
            count = 'Done';
          }
          return (
            '<section class="panel" aria-labelledby="h-now"><div class="panel-head"><h2 id="h-now">Now</h2><span class="count">' +
            count +
            '</span></div><div class="card now">' +
            body +
            '</div></section>'
          );
        }

        /* ---------- gate track (tasks whose kind is a checkpoint) ---------- */
        function gateTasks(d) {
          var out = [];
          (d.phases || []).forEach(function (p) {
            p.tasks.forEach(function (t) {
              if (GATE_KINDS.indexOf(t.kind) >= 0) out.push({ t: t, p: p });
            });
          });
          return out;
        }
        function gateStep(g, i) {
          var t = g.t,
            title = String(t.title || '').replace(GATE_PREFIX, '') || t.title;
          var num = t.status === 'verified' ? icon('verified', 14) : String(i + 1);
          return (
            '<li><button type="button" class="gstep st-' +
            esc(t.status) +
            '" data-jump="' +
            esc(t.id) +
            '" data-fid="gate:' +
            esc(t.id) +
            '" aria-label="' +
            esc(
              kindLabel(t.kind) +
                ' ' +
                t.id +
                ': ' +
                title +
                ', ' +
                statusLabel(t.status, t.kind, t.title) +
                '. Show task',
            ) +
            '">' +
            '<span class="gnum" aria-hidden="true">' +
            num +
            '</span><span class="gkind">' +
            esc(kindLabel(t.kind)) +
            '</span><span class="gtitle">' +
            esc(title) +
            '</span>' +
            '<span class="gfoot"><span class="mono">' +
            esc(t.id) +
            '</span><span>P' +
            esc(g.p.id) +
            '</span>' +
            (QUIET_ST.indexOf(t.status) < 0 ? pill(t.status, t.kind, t.title) : '') +
            '</span></button></li>'

        function gates(d) {
          var g = gateTasks(d);
          if (!g.length) return '';
          var passed = g.filter(function (x) {
            return x.t.status === 'verified';
          }).length;
          return (
            '<section class="panel" aria-labelledby="h-gt"><div class="panel-head"><h2 id="h-gt">Gate track</h2><span class="count tnum">' +
            passed +
            ' of ' +
            g.length +
            ' passed</span></div>' +
            '<ol class="gates">' +
            g.map(gateStep).join('') +
            '</ol></section>'
          );
        }

        /* ---------- stuck ---------- */
        function stuck(d) {
          var s = d.stuck || [];
          if (!s.length) return '';
          return (
            '<section class="panel" aria-labelledby="h-st"><div class="panel-head"><h2 id="h-st">Stuck</h2><span class="count">' +
            s.length +
            '</span></div><div class="card attn" role="alert">' +
            s
              .map(function (i) {
                var full = taskById(d, i.task) || {};
                return (
                  '<div class="stuckitem"><div>' +
                  pill(i.status, full.kind, i.title || full.title) +
                  ' <span class="mono">' +
                  esc(i.task) +
                  '</span> ' +
                  esc(i.title) +
                  (i.attempt ? ' <span class="muted">attempt ' + esc(i.attempt) + '</span>' : '') +
                  '</div>' +
                  '<div class="kv"><span>Reason</span><span>' +
                  esc(i.reason || 'not recorded') +
                  '</span></div><div class="kv"><span>To unblock</span><span>' +

        /* ---------- questions ---------- */
        function qKey(q) {

        }
        /* a server `answer` wins over the local flag; answered questions count as done but cannot be restored */
        function qSplit(d) {

            else out.open.push(q);

        }
        function qRow(q) {
          var key = qKey(q),
            open = !!state.q.open[key],
            did = 'qd-' + key.replace(/[^\w-]/g, '_');
          var tasks =
            q.tasks && q.tasks.length
              ? '<span class="mono">' + esc(q.tasks.join(', ')) + '</span>'
              : '';
          var alts = q.alternatives

            : '';
          return (
            '<div class="qrow' +

            '">' +
            '<button class="qtoggle" data-qtoggle="' +

            esc(key) +

        function qDoneSection(s) {

            '<div class="qdonebar"><button class="btn quiet" data-qshowdone="1" data-fid="q-showdone" aria-expanded="' +
            sd +

        function questionsBody(s) {

        function questions(d) {

          persistQ();
          render(d);
          return true;
        }

        /* ---------- phases ---------- */
        function phaseStats(p) {

        /* ---------- phase detail: selected phase, else current, else first unfinished ---------- */

        /* ---------- tasks list ---------- */

        function token(key, v, text) {

        function matches(t, p) {

        /* the dominant kind is the default; tagging it on every row buries the rare kinds (gate, e2e, dod) */

        function isLongCmd(c) {

        }
        function groupHeading(p, rowsShown) {

        function tasksList(d) {
          var verifiedIds = {},
            kinds = {},

          restoreFocus(fid);
        }

        /* ---------- events (delegated; survive re-render) ---------- */
        function copyText(el) {
          var key = el.dataset.key;
          var done = function () {
            state.copied[key] = true;
            render(window.DASHBOARD);
            setTimeout(function () {
              delete state.copied[key];
              render(window.DASHBOARD);
            }, COPIED_MS);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(el.dataset.copy).then(done, function (err) {
              console.warn('clipboard failed', err);
            });
            return;
          }
          var ta = document.createElement('textarea');
          ta.value = el.dataset.copy;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            done();
          } catch (err) {
            console.warn('copy failed', err);
          }
          ta.remove();
        }
        document.addEventListener('click', function (e) {
          var el = e.target.closest(
            '[data-copy],[data-f],[data-phase],[data-jump],[data-task],[data-clear],[data-clearq],[data-more],[data-expand],[data-qtoggle],[data-qdone],[data-qdone-all],[data-qrestore],[data-qrestore-all],[data-qshowdone],[data-qpanel]',
          );
          if (!el) return;
          var ds = el.dataset;
          /* specific controls first; the generic task toggle is last so nothing nested can be swallowed by it */
          if (ds.copy != null) {
            copyText(el);
            return;
          }
          if (handleQuestionClick(el)) return;
          if (ds.more) {
            var flag = ds.more + 'All';
            state.ui[flag] = !state.ui[flag];
            state.fid = el.getAttribute('data-fid');
            render(window.DASHBOARD);
            return;
          }
          if (ds.expand) {
            state.ui.open[ds.expand] = !state.ui.open[ds.expand];
            state.fid = el.getAttribute('data-fid');
            render(window.DASHBOARD);
            return;
          }
          if (ds.clearq) {
            state.filters.q = '';
            searchEl.value = '';
            persist();
            render(window.DASHBOARD);
            return;
          }
          if (ds.clear) {
            state.filters = { q: '', status: [], kind: [], phase: [] };
            searchEl.value = '';
            persist();
            render(window.DASHBOARD);
            return;
          }
          if (ds.f) {
            toggle(state.filters[ds.f], ds.v);
            persist();
            /* removing a token hands focus to its chip, which survives in the filter row */
            state.fid = 'f:' + ds.f + ':' + ds.v;
            render(window.DASHBOARD);
            return;
          }
          if (ds.phase) {
            toggle(state.filters.phase, ds.phase);
            persist();
            render(window.DASHBOARD);
            var pd = document.getElementById('phase-detail');
            if (state.filters.phase.length && pd) pd.scrollIntoView({ block: 'start' });
            return;
          }
          if (ds.jump) {
            jumpToTask(ds.jump);
            return;
          }
          if (ds.task) {
            var id = ds.task;
            state.expanded[id] = !state.expanded[id];
            var row = el.closest('.task');
            row.classList.toggle('open', !!state.expanded[id]);
            el.setAttribute('aria-expanded', !!state.expanded[id]);
          }
        });
        window.addEventListener('resize', fitClamps);

        /* ---------- refresh: swap the data.js script tag, re-render, no page reload ---------- */
        function loadData() {
          var old = document.getElementById('data-script');
          if (old) old.remove();
          var s = document.createElement('script');
          s.id = 'data-script';
          s.src = 'data.js?t=' + Date.now();
          s.onload = s.onerror = renderIfChanged;
          document.head.appendChild(s);
        }
        /* skipping identical data keeps focus, hover and open rows stable across refreshes */
        var lastSnapshot = null;
        function renderIfChanged() {
          var d = window.DASHBOARD;
          /* stalled depends on the clock, so it is part of the snapshot */
          var snap = d ? JSON.stringify(d) + isStalled(d) : '';
          if (snap === lastSnapshot) return;
          lastSnapshot = snap;
          render(window.DASHBOARD);
        }
        function tickTimes() {
          var els = document.querySelectorAll('time[datetime]');
          for (var i = 0; i < els.length; i++)
            els[i].textContent = ago(els[i].getAttribute('datetime'));
          renderIfChanged();
        }
        loadData();
        setInterval(loadData, REFRESH_MS);
        setInterval(tickTimes, TICK_MS);
      })();
    </script>
  </body>
</html>
