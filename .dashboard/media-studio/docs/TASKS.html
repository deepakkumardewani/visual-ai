<script>document.getElementById("doc").innerHTML = marked.parse("# Media Studio Tasks\n\n**Source:** `agent_docs/media-studio/SPEC.md` (requirements), `PLAN.md` (6 phases, 29 slices), `REPO_MAP.md` (verified paths). Phases: 0 shared infrastructure, 1 Song, 2 Music, 3 Speech, 4 Video, 5 Tools.\n\n**Commands:** `bun run check`, `bun run test`, `bun run lint`, `bun run check:model-docs`; web unit `cd apps/web && npx vitest run \u003cspec>`; api unit `cd apps/api && npx vitest run \u003cspec>`; shared unit `bunx vp test run packages/shared/\u003cspec>` from the repo root (packages/shared has only a build script; the root vite.config.ts test block runs its specs); api typecheck `cd apps/api && bun run type-check`; `bun run check:model-docs` runs `scripts/check-model-docs.mjs`; e2e `cd apps/web && bunx playwright test e2e/qa/\u003cspec> --repeat-each=3`. Never start the server; it is always running.\n\n**Mock-only rule:** agents, subagents, tests and e2e never call real Replicate, Dodo live mode, email or any other paid or outbound service. Every paid POST itself (`/generate/audio/*`, `/generate/audio/voices`, `/generate/video`, `/generate/tools/*`, `/prompt/lyrics`, and `/generate/image` for sketch) is stubbed with `MediaGenerationStub` or `GenerationStub`, not only the progress stream and result URLs. The always-running API serves the e2e Clerk user in `E2E_USER_IDS` the fake Replicate client, and `paidCallGuard` fails the run on any un-intercepted paid call; it is never bypassed, narrowed or opted out of. Unit tests inject fakes for Replicate, DeepSeek, Cloudinary, Dodo and email. If a real call is ever needed, ask the owner through AskUserQuestion first.\n\n## Standing rules\n\n- **UI tasks:** run the impeccable skill first (never frontend-design). Reuse existing design tokens and components. Avoid a generic AI look. State the screen's design intent from PLAN section 1.12. Every UI task covers empty, loading, progress, success, error and 402 states, exact copy, keyboard use, focus and aria, 375px layout and reduced motion.\n- **Code quality:** functions under about 30 lines, no magic numbers or strings (named constants), no swallowed errors, shared logic extracted, large template blocks split into components.\n- **Money:** credits are deducted once, only on success, through the shared `lib/credit-deduction.ts`; the 402 balance check runs before queueing; cost and quantity are computed server-side. Voice-clone consent is written before any paid call is queued.\n- **Browser checks:** use agent-browser with a repo-unique session and finish with `agent-browser close`. Behaviour evidence comes from the mocked QA specs.\n- **Tests:** implementation tasks do not write specs; `Unit:` and `E2E:` tasks follow each phase's implementation.\n\n## Open questions and defaults applied\n\n- G1: P-Video audio cost is billed on stored audio duration clamped to 20 seconds and shown as Estimated.\n- G2: the `/media/*` endpoints are not named in the spec; the plan's names are used.\n- G3: one combined history cap for images plus media.\n- G4: VoiceConsent is retained after a voice is deleted.\n- G5: MAX_VOICES_PER_USER = 10.\n- G6: `blockSec` is added to the pricing unit for Autocaption.\n- G7: one HTMLAudioElement is shared with wavesurfer.\n- G8: StudioPlaceholder renders until a page ships.\n- G9: the four new Mongo collections need owner approval (first task).\n- G10: VIDEO_WATERMARK_PLACEMENT · default: read-only from the model's published source or public example outputs (never a paid run); if neither states it, the constant is `null`, the preview draws the text with no position claim and the fixed-position caption · alternatives: owner supplies a sample output; one approved paid run.\n- G11: FeatureType.SKETCH is for routing, nav and labels only; sketch results are written exactly like a normal image (image type, existing image feature) and appear under the Images history filter.\n- G12: lyrics section and condense are multiplexed on POST /prompt/lyrics.\n- G13: the existing runGenerationJob order is kept and matches SPEC R-INF-6: run on Replicate, persist the record, deduct once, copy to Cloudinary, complete.\n- G14: Song empty-state sample loop (R-SONG-8) · default: the sample row renders only when SONG_SAMPLE_LOOP_URL is set; until the owner supplies a royalty-free loop it is hidden and the 3 example ideas still show · alternatives: owner-made loop from a manual generation; licensed stock loop.\n- G15: Shared unit command · default: `bunx vp test run packages/shared/\u003cspec>` from the root (no test script in packages/shared) · alternatives: add a `test` script to packages/shared (ask first).\n- G16: Page file names follow SPEC section 1 (`Music.vue`, `Speech.vue`, `Video.vue`, `Tool*.vue`) · default applied in all three docs · alternatives: `*Studio.vue` naming.\n- TipTap is user-approved: install exactly `@tiptap/vue-3`, `@tiptap/core`, `@tiptap/pm`, `@tiptap/extension-document`, `@tiptap/extension-paragraph`, `@tiptap/extension-text`, `@tiptap/extension-history`, `@tiptap/extension-placeholder`, `@tiptap/extension-character-count`, `@tiptap/suggestion`; never `@tiptap/starter-kit`.\n- Ask first: wavesurfer.js (before the waveform task), @breezystack/lamejs (before the export task), collections MediaAsset, MediaUpload, Voice and VoiceConsent.\n\n## Phase 0: Shared media infrastructure\n\n**Adds:** Adds the shared plumbing every audio, video and tool surface uses: one model registry and credit function, a safe paid-call-free e2e harness, the job pipeline with charge-on-success, uploads and asset storage, the new header menus and routes, a persistent mini-player, media in History, and shortcuts. Users see the new Video, Audio and Tools menus (each opening an honest coming-soon page) and, once a generation exists, media in History with a player that survives navigation.\n**Try in UI:** Open the header and see Image, Video, Audio and Tools ; open Audio with the keyboard and press Escape ; open /audio/song and read the coming-soon page ; open History at 375px width\n\n### ☐ T0.1 Record ask-first approvals for new collections\n\n- **Kind:** dod\n- **Files:** `agent_docs/media-studio/APPROVALS.md` (new)\n- **Spec:** R-INF-5, R-INF-14, R-INF-17, R-TTS-11 (collections), PLAN section 2\n- **Do:** Before any model file is written, ask the owner through AskUserQuestion (recommended option first) to approve the four new Mongo collections MediaAsset, MediaUpload (24h TTL), Voice and VoiceConsent (append-only) and record the answer, date and any changes in APPROVALS.md. Also list the two npm packages needing approval later (wavesurfer.js before the waveform task, @breezystack/lamejs before the export task) with status pending, and the open questions G1 to G13 with their default and answer. If the owner declines a collection, stop and report; do not start tasks that need it.\n- **Acceptance:**\n  - AC1: APPROVALS.md lists MediaAsset, MediaUpload, Voice and VoiceConsent each with an approved or declined line and a date.\n  - AC2: APPROVALS.md lists wavesurfer.js and @breezystack/lamejs as pending, and G1 to G13 each with the default applied.\n  - AC3: No file other than APPROVALS.md changed in this task.\n- **Verify:**\n  - V1: `grep -c -E 'MediaAsset|MediaUpload|Voice|VoiceConsent' agent_docs/media-studio/APPROVALS.md` is at least 4 and each line contains approved or declined\n  - V2: `grep -c -E '^- G(1[0-3]|[1-9]):' agent_docs/media-studio/APPROVALS.md` equals 13 and `grep -c -E 'wavesurfer|lamejs' agent_docs/media-studio/APPROVALS.md` is at least 2\n  - V3: `git status --short` lists only agent_docs/media-studio/APPROVALS.md as new from this task\n\n### ☐ T0.2 Shared media limits, job kinds and the single credit function (S0.1a)\n\n- **Kind:** implementation\n- **Files:** `packages/shared/src/models/media-limits.ts` (new), `packages/shared/src/models/credits.ts` (edit), `packages/shared/src/models/types.ts` (edit), `packages/shared/src/types/domain.ts` (edit)\n- **Depends on:** T0.1\n- **Creates:** MEDIA_CREDITS_PER_USD, MIN_JOB_CREDITS, getMediaCreditCost, MediaCostInput, ModelKind, EXPENSIVE_JOB_CREDITS, MAX_VOICES_PER_USER, P_VIDEO_MAX_SEC, MAX_VIDEO_AUDIO_BYTES, getModelKind\n- **Uses:** getCreditCost, FeatureType, JobStatus, CatalogModelKey, ModelDefinition\n- **Risk:** high\n- **Surfaces:** logic\n- **Spec:** R-INF-1, R-INF-2, R-INF-3, R-INF-6, R-INF-7\n- **Do:** Copy the pattern of `packages/shared/src/models/image-limits.ts`. Create media-limits.ts as the only home of media limits and named constants (EXPENSIVE_JOB_CREDITS = 150, MAX_VOICES_PER_USER = 10, upload byte caps and second caps from SPEC section 5 and 11, P_VIDEO_MAX_SEC = 20, EXPORT_PCM_CAP_BYTES, EDITOR_PEAK_BUCKETS, lyrics and prompt limits); no magic numbers elsewhere. In credits.ts add MEDIA_CREDITS_PER_USD = 200, MIN_JOB_CREDITS = 1 and the pure function getMediaCreditCost(modelKey, input) = max(MIN_JOB_CREDITS, ceil(round6(usd * 200) - 1e-9)) for the 5 MediaCostInput variants (file, chars, seconds with resolution and draft, run, blocks of 30 s). In types.ts add ModelKind ('image'|'music'|'song'|'tts'|'video'|'tool'), the media field types, MediaPricing (unit file|second|kChars|kTokens|run plus optional blockSec, gap G6) and the new CatalogModelKey members from PLAN 1.3; getModelKind defaults legacy entries to image. In domain.ts extend FeatureType with SONG, MUSIC, SPEECH, VIDEO, WATERMARK_IMAGE, WATERMARK_VIDEO, AUTOCAPTION, SKETCH (SKETCH is for routing and labels only, G11) and extend JobStatus with optional stage, elapsedMs, assetId, asset, credits and the noCharge failure reason union. Functions stay under 30 lines. Tests are not written here: T0.4, T0.29 cover Unit: table test regenerates every SPEC section 8 row from the constant and asserts the exact credits; Unit: chars 0 -> 1, 1, 1000, 2000, 10000 and blocks 30, 31, 120 s boundary cases; Unit: registry test asserts getModelKind is image for all legacy keys.\n- **Acceptance:**\n  - AC1: getMediaCreditCost returns the integer credits of every SPEC section 8 row, for example 5 credits for 0.025 USD, never 6 from float error.\n  - AC2: A zero-character TTS input costs MIN_JOB_CREDITS (1).\n  - AC3: No constant for a limit or multiplier is declared outside media-limits.ts and credits.ts.\n  - AC4: getModelKind returns image for every pre-existing registry key.\n  - AC5: FeatureType and JobStatus accept the new members and existing image code still typechecks.\n- **Verify:**\n  - V1: `grep -rn -E '200|150' packages/shared/src/models/credits.ts packages/shared/src/models/media-limits.ts` shows each only on its named constant line\n  - V2: `bun run check`\n  - V3: `bunx vp test run packages/shared` (existing shared tests stay green)\n  - V4: `cd apps/api && bun run type-check`\n\n### ☐ T0.3 Registry entries for all media models and the web catalog (S0.1b)\n\n- **Kind:** implementation\n- **Files:** `packages/shared/src/models/registry.ts` (edit), `apps/web/src/utils/models.ts` (edit), `apps/api/src/types/index.ts` (edit), `apps/web/src/types/index.ts` (edit), `apps/web/src/assets/providers/` (edit)\n- **Depends on:** T0.2\n- **Creates:** LYRIA_2, MINIMAX_MUSIC_26, MINIMAX_MUSIC_15, STABLE_AUDIO_25, IMAGE_WATERMARK, AUTOCAPTION, VIDEO_WATERMARK, INWORLD_TTS_2, INWORLD_TTS_15_MAX, MINIMAX_SPEECH_28_HD, MINIMAX_SPEECH_28_TURBO, CHATTERBOX_TURBO, MINIMAX_VOICE_CLONE, P_VIDEO, WAN_3, pricesVerifiedOn, FIXED_INPUTS\n- **Uses:** MODEL_REGISTRY, MODELS, getModelDefinition\n- **Risk:** high\n- **Surfaces:** logic\n- **Spec:** R-INF-1, R-INF-2, R-INF-3, R-INF-18\n- **Do:** Follow docs/MODEL_ONBOARDING.md sections 1 and 3. Add the 15 registry entries from SPEC section 4: 14 user-facing models plus the MINIMAX_VOICE_CLONE helper, which gets no picker or pricing-list row (LYRIA_2, MINIMAX_MUSIC_26, MINIMAX_MUSIC_15, STABLE_AUDIO_25, IMAGE_WATERMARK, AUTOCAPTION, VIDEO_WATERMARK, INWORLD_TTS_2, INWORLD_TTS_15_MAX, MINIMAX_SPEECH_28_HD, MINIMAX_SPEECH_28_TURBO, CHATTERBOX_TURBO, P_VIDEO, WAN_3, MINIMAX_VOICE_CLONE) with kind, tier standard (never set isPro), media pricing, inputs map (each inputKey cites its SPEC 5.x row in a comment), and FIXED_INPUTS (disable_safety_filter false, audio_format never sent, no_op never sent, watermark default text never sent). Community models carry their pinned version hash. Re-read each Replicate model page and schema (read only, never run a model) and stamp pricesVerifiedOn '2026-11-15'; list any price delta in the report. Add fromRegistry entries in models.ts with presentation fields only, add PROVIDER_DISPLAY_NAMES rows and reuse or add provider svgs under assets/providers. Sync the FeatureType copies in apps/api/src/types/index.ts and apps/web/src/types/index.ts. Make the image picker, ImageGenerateAside and pricing cost list filter on kind === 'image'. Tests are not written here: T0.4, T0.29 cover Unit: registry shape test over all 15 entries; Unit: FIXED_INPUTS assertion per model; Unit plus `cd apps/web && npx vitest run src/utils/models.test.ts`: picker excludes media keys; Unit: FeatureType parity test across the three files.\n- **Acceptance:**\n  - AC1: MODEL_REGISTRY has exactly 15 new entries (14 user-facing models plus the MINIMAX_VOICE_CLONE helper), each with kind, pricing and a pinned hash where community, and none sets isPro.\n  - AC2: Every FIXED_INPUTS value is present on its model and no unsupported field is declared in fields.\n  - AC3: The image ModelPicker lists no media model key.\n  - AC4: FeatureType matches across the shared, api and web declarations.\n  - AC5: pricesVerifiedOn equals 2026-11-15 beside the price table and any difference from SPEC section 4 is reported.\n- **Verify:**\n  - V1: `grep -n pricesVerifiedOn packages/shared/src/models/registry.ts` and `bun run check:model-docs`\n  - V2: `bunx vp test run packages/shared` (existing shared tests stay green)\n  - V3: `cd apps/api && bun run type-check`\n  - V4: `cd apps/api && bun run test` (existing api tests stay green)\n  - V5: `cd apps/web && bun run test` (existing web tests stay green)\n\n### ☐ T0.4 Unit: shared credits, limits and registry\n\n- **Kind:** unit\n- **Files:** `packages/shared/src/models/credits.ts` (edit), `packages/shared/src/models/media-limits.ts` (edit), `packages/shared/src/models/registry.ts` (edit), `apps/web/src/utils/models.ts` (edit)\n- **Depends on:** T0.3\n- **Acceptance:**\n  - AC1: Every file has at least 80% lines, branches, functions and statements coverage (target above 95%) and no it.fails is used.\n  - AC2: Tests cover each case named in the Verify of the previous two tasks.\n  - AC3: Mock-only: Replicate, DeepSeek, Cloudinary, Dodo and email clients are injected fakes or vi.mock stubs; no test makes a network call, starts a server or reads a live key.\n- **Verify:**\n  - V1: `bunx vp test run packages/shared/src/models/credits.test.ts packages/shared/src/models/registry.test.ts packages/shared/src/models/media-limits.test.ts --coverage --coverage.include=packages/shared/src/models/credits.ts --coverage.include=packages/shared/src/models/media-limits.ts --coverage.include=packages/shared/src/models/registry.ts --coverage.reporter=text`\n  - V2: `cd apps/web && npx vitest run src/utils/models.test.ts --coverage --coverage.include=src/utils/models.ts --coverage.reporter=text`\n\n### ☐ T0.5 Extend the paid-call mocking harness: fake outputs and guard (S0.2a)\n\n- **Kind:** implementation\n- **Files:** `apps/api/src/lib/replicate.ts` (edit), `apps/api/src/lib/lyrics-generator.ts` (new), `apps/web/e2e/support/paidCallGuard.ts` (edit), `apps/web/e2e/support/cloudinaryMock.ts` (edit)\n- **Depends on:** T0.3\n- **Creates:** FAKE_REPLICATE_AUDIO_URL, FAKE_REPLICATE_VIDEO_URL, FAKE_REPLICATE_TRANSCRIPT_URL, FAKE_VOICE_ID, PAID_PATH_PATTERN\n- **Uses:** FAKE_REPLICATE_OUTPUT_URL, runReplicate, isPaidCall, installPaidCallRouteGuard, pickMockAsset, installCloudinaryMock\n- **Risk:** high\n- **Surfaces:** security,logic\n- **Spec:** R-INF-9\n- **Do:** Read replicate.ts and paidCallGuard.ts first. Extend the existing FAKE_REPLICATE_OUTPUT_URL branch (taken when the authed user is in env.E2E_USER_IDS) so it returns FAKE_REPLICATE_AUDIO_URL, FAKE_REPLICATE_VIDEO_URL, FAKE_REPLICATE_TRANSCRIPT_URL or FAKE_VOICE_ID by model kind and key; non-e2e users still use the real client. Create lyrics-generator.ts with only the fake branch for e2e users (fixed fake sections, no DeepSeek call); the real generator arrives in the lyrics task. Export PAID_PATH_PATTERN and broaden it to POST /generate/audio/*, /generate/tools/*, /prompt/lyrics and /generate/audio/voices (it already covers /generate/video). The guard is only ever broadened, never narrowed or opted out of. Extend cloudinaryMock.ts so mock uploads can return audio and video shaped assets. Tests are not written here: T0.7, T0.29 cover Unit: e2e user returns each fake URL by kind and the spy for the real client has zero calls; Unit: non-e2e user selects the real client path with the spy only inspected; Unit: isPaidCall table for song, music, speech, voices, tools, video, lyrics and GET variants; Unit: existing paidCallGuard tests still pass unchanged.\n- **Acceptance:**\n  - AC1: For an E2E_USER_IDS user the media kinds return their fake URL and the real Replicate client is never invoked.\n  - AC2: For any other user the real client is selected (asserted with an injected spy, never called for real).\n  - AC3: isPaidCall is true for POST on each broadened path and false for GET on the same paths.\n  - AC4: The guard exports no opt-out and its previous matches still match.\n  - AC5: The Cloudinary mock returns an audio-shaped and a video-shaped asset.\n- **Verify:**\n  - V1: `cd apps/web && npx vitest run e2e/support/cloudinaryMock.test.ts`\n  - V2: `cd apps/api && bun run type-check`\n  - V3: `cd apps/api && bun run test` (existing api tests stay green)\n  - V4: `cd apps/web && npx vitest run e2e/support/paidCallGuard.test.ts e2e/support/cloudinaryMock.test.ts` (existing harness tests stay green)\n  - V5: `bun run check`\n\n### ☐ T0.6 MediaGenerationStub and audio fixtures (S0.2b)\n\n- **Kind:** implementation\n- **Files:** `apps/web/e2e/fixtures/media.ts` (new), `apps/web/e2e/fixtures/assets/sample.wav` (new), `apps/web/e2e/fixtures/assets/sample.mp3` (new)\n- **Depends on:** T0.5\n- **Creates:** MediaGenerationStub\n- **Uses:** GenerationStub, test, expect\n- **Risk:** high\n- **Surfaces:** security,logic\n- **Spec:** R-INF-9\n- **Do:** Copy the pattern of GenerationStub in `apps/web/e2e/fixtures/generation.ts`. MediaGenerationStub stubs the POST itself (202 or 402 or 422), the SSE progress stream and the result URLs, because stubbing only the stream is not enough. Variants: success, failure (noCharge), insufficient (402 with required and available), moderated (422 PROMPT_REJECTED) and slow (queued, composing, mastering, saving). Generate sample.wav (1 s, 8 kHz mono, tiny) and sample.mp3 (a few valid MPEG frames, at most 5 s) with a one-off node snippet; never commit the script and never fetch anything. Tests are not written here: T0.4, T0.7, T0.11, T0.14, T0.17, T0.27, T0.28, T0.29 cover `cd apps/web && npx vitest run e2e/support/paidCallGuard.test.ts` plus a spec in T0.30 that selects every variant; T0.30 asserts the guard reports a failure for a deliberately un-intercepted POST to each broadened path (guard self-test, never a real call).\n- **Acceptance:**\n  - AC1: Each of the five variants is selectable and intercepts the matching POST route before any network call.\n  - AC2: The stub fails the test if a media POST path is hit without being intercepted.\n  - AC3: Both fixtures are at most 5 seconds and under 100 KB and are real decodable audio.\n- **Verify:**\n  - V1: `ls -l apps/web/e2e/fixtures/assets/sample.mp3 apps/web/e2e/fixtures/assets/sample.wav` shows each under 102400 bytes\n  - V2: `cd apps/web && npx vitest run e2e/support/paidCallGuard.test.ts e2e/support/cloudinaryMock.test.ts` (existing harness tests stay green)\n  -
