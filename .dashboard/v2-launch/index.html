<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual AI V2 Launch Bundle · Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        /* surfaces tinted toward indigo hue 275 */
        --bg: oklch(0.17 0.012 275);
        --surface: oklch(0.21 0.014 275);
        --surface-2: oklch(0.25 0.016 275);
        --line: oklch(0.34 0.02 275);
        --text: oklch(0.95 0.006 275);
        --text-2: oklch(0.78 0.015 275);
        --text-3: oklch(0.68 0.02 275);
        --accent: oklch(0.68 0.17 277);
        --accent-ink: oklch(0.16 0.03 277);
        --accent-soft: oklch(0.3 0.07 277);
        --accent-text: oklch(0.82 0.1 277);
        --s-verified: oklch(0.78 0.15 155);
        --s-built: oklch(0.82 0.13 85);
        --s-verifying: oklch(0.8 0.11 215);
        --s-building: oklch(0.8 0.12 250);
        --s-queued: oklch(0.76 0.03 275);
        --s-ready: oklch(0.82 0.08 185);
        --s-waiting: oklch(0.66 0.025 275);
        --s-failed: oklch(0.74 0.17 25);
        --s-blocked: oklch(0.76 0.15 55);
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 12px;
        --space-lg: 16px;
        --space-xl: 24px;
        --space-2xl: 32px;
        --space-3xl: 48px;
        --radius: 8px;
        --radius-sm: 4px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --font-body: 'Schibsted Grotesk', system-ui, sans-serif;
        --font-display: 'Bricolage Grotesque', 'Schibsted Grotesk', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 15px/1.55 var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--accent-text);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .skip {
        position: absolute;
        left: -999px;
        top: 0;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 8px 12px;
        z-index: 100;
      }
      .skip:focus {
        left: 8px;
        top: 8px;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--space-xl) var(--space-lg) var(--space-3xl);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .muted {
        color: var(--text-2);
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 32px;
        line-height: 1.15;
      }
      h2 {
        font-size: 18px;
        line-height: 1.3;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
      }
      code.ic {
        font-family: var(--font-mono);
        font-size: 0.9em;
        background: var(--bg);
        padding: 0 4px;
        border-radius: var(--radius-sm);
        color: var(--text);
      }

      /* header */
      header.top {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--space-md) var(--space-lg);
        align-items: end;
        margin-bottom: var(--space-lg);
      }
      .top-meta {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        align-items: center;
        justify-content: flex-end;
      }
      .updated {
        font-size: 13px;
        color: var(--text-3);
      }
      .stalled {
        display: inline-block;
        margin-left: var(--space-sm);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        background: oklch(0.3 0.07 55);
        color: var(--s-blocked);
        font-weight: 600;
        font-size: 12px;
      }
      .progress {
        grid-column: 1/-1;
        display: grid;
        gap: var(--space-sm);
      }
      .prog-head {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--space-xs) var(--space-sm);
        color: var(--text-2);
        font-size: 14px;
      }
      .prog-head .pct {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        color: var(--text);
      }
      .prog-head .sep {
        color: var(--text-3);
      }
      .progress .bar {
        height: 10px;
      }
      .bar {
        background: var(--surface-2);
        border-radius: 99px;
        overflow: hidden;
        display: flex;
        height: 8px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--s-verified);
        transition: width 0.3s var(--ease);
      }
      .bar > i.b,
      .sw.b {
        background: repeating-linear-gradient(
          135deg,
          var(--s-built) 0 3px,
          color-mix(in oklch, var(--s-built) 22%, var(--surface-2)) 3px 6px
        );
      }
      .bar > i.a {
        background: var(--accent);
      }
      .bar > i.x {
        background: var(--s-failed);
      }
      .bar.sm {
        height: 6px;
      }
      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs) var(--space-lg);
        font-size: 13px;
        color: var(--text-2);
      }
      .legend li {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .legend b {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .sw {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--s-verified);
      }
      .sw.a {
        background: var(--accent);
      }
      .sw.x {
        background: var(--s-failed);
      }
      .sw.r {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      /* constraint banner: compact */
      .constraint {
        display: flex;
        gap: var(--space-sm);
        align-items: flex-start;
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        border-radius: var(--radius);
        margin-bottom: var(--space-lg);
      }
      .constraint svg {
        flex: none;
        margin-top: 2px;
      }
      .constraint p {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text-2);
        max-width: 80ch;
      }
      .constraint strong {
        color: var(--text);
      }

      /* panels */
      section.panel {
        margin-top: var(--space-2xl);
      }
      .panel-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-md);
        margin-bottom: var(--space-md);
        flex-wrap: wrap;
      }
      .count {
        font-size: 13px;
        color: var(--text-3);
      }
      .sub-h {
        margin: 0 0 var(--space-sm);
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-3);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: var(--space-lg);
      }

      /* status pill: 11px caps, 4px radius, no border; icon + text so color is not alone */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        background: color-mix(in oklch, var(--c) 18%, var(--surface));
        color: var(--c);
        white-space: nowrap;
      }
      .pill svg {
        width: 11px;
        height: 11px;
      }
      .pill.built {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--c);
      }
      .pill.built svg {
        stroke-dasharray: 2 2;
      }
      .st-verified {
        --c: var(--s-verified);
      }
      .st-built {
        --c: var(--s-built);
      }
      .st-verifying {
        --c: var(--s-verifying);
      }
      .st-building {
        --c: var(--s-building);
      }
      .st-queued {
        --c: var(--s-queued);
      }
      .st-ready {
        --c: var(--s-ready);
      }
      .st-waiting {
        --c: var(--s-waiting);
      }
      .st-failed {
        --c: var(--s-failed);
      }
      .st-blocked {
        --c: var(--s-blocked);
      }
      .st-accent {
        --c: var(--accent-text);
      }
      .st-muted {
        --c: var(--text-3);
      }

      /* buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 36px;
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--surface-2);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition:
          background 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .btn:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .btn:active {
        background: var(--accent);
      }
      .btn.copied {
        border-color: var(--s-verified);
        color: var(--s-verified);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--accent-text);
      }
      .btn.quiet:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .push {
        margin-left: auto;
      }

      /* now */
      .now-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-md);
      }
      .now-head h3 {
        font-size: 16px;
      }
      .now-name {
        font-size: 14px;
        color: var(--text-2);
      }
      .now-meta {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-md);
        font-size: 13px;
        color: var(--text-2);
      }
      .att {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .pips {
        display: inline-flex;
        gap: 3px;
      }
      .pips i {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .pips i.on {
        background: var(--accent);
        box-shadow: none;
      }
      .pips.last i.on {
        background: var(--s-failed);
      }
      .now ul {
        list-style: none;
        margin: var(--space-md) 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .now li {
        display: grid;
        grid-template-columns: 96px 56px 1fr;
        gap: var(--space-sm);
        align-items: center;
        font-size: 14px;
      }
      .now li .pill {
        justify-self: start;
      }
      section.panel.panel-tight {
        margin-top: var(--space-lg);
      }
      .now-done {
        margin: 0;
        font-size: 14px;
        color: var(--text-2);
      }
      .now-idle {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-sm);
      }
      .now-idle .cmd {
        flex: 1 1 280px;
        margin: 0;
      }
      .cmd {
        display: flex;
        gap: var(--space-sm);
        align-items: center;
        flex-wrap: wrap;
        margin-top: var(--space-sm);
      }
      .cmd code {
        flex: 1 1 220px;
        min-width: 0;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .ready-h {
        margin-top: var(--space-md);
      }
      .readyrows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 2px;
      }
      .readyrow {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        gap: var(--space-sm);
        align-items: center;
        width: 100%;
        min-height: 36px;
        padding: 4px var(--space-sm);
        border-radius: var(--radius-sm);
        font-size: 14px;
      }
      .now .readyrows li {
        display: block;
      }
      .readyrow:hover {
        background: var(--surface-2);
      }
      .readyrow:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .readyrow .tid {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--accent-text);
      }

      /* phases: compact cards; double as task filters */
      .phases {
        display: grid;
        gap: var(--space-sm);
        grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      }
      @media (min-width: 720px) {
        .phases {
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }
      }
      .phase {
        display: grid;
        gap: var(--space-sm);
        grid-template-rows: auto auto 1fr;
        align-content: stretch;
        text-align: left;
        cursor: pointer;
        width: 100%;
        min-height: 44px;
        padding: var(--space-md);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        transition:
          border-color 0.15s var(--ease),
          background 0.15s var(--ease);
      }
      .phase:hover {
        border-color: color-mix(in oklch, var(--accent) 55%, var(--line));
      }
      .phase[aria-pressed='true'] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        background: color-mix(in oklch, var(--accent) 14%, var(--surface));
      }
      .phase[aria-pressed='true'] .pid {
        color: var(--accent-text);
      }
      /* name always reserves two lines so the bar and meta sit at the same height on every card */
      .ptop {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        min-width: 0;
      }
      .pid {
        flex: none;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.3;
        padding-top: 2px;
        color: var(--text-3);
      }
      .pname {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        font-size: 14px;
        line-height: 1.3;
        min-height: 2.6em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .nowtag {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent-text);
      }
      .nowtag i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .gate {
        flex: none;
        display: inline-flex;
        align-self: flex-start;
        padding-top: 2px;
        color: var(--s-verified);
      }
      .riskmark {
        flex: none;
        display: inline-flex;
        align-self: flex-start;
        padding-top: 2px;
        color: var(--s-blocked);
      }
      .nowtag {
        padding-top: 3px;
      }
      .pmeta {
        align-self: start;
        display: flex;
        flex-wrap: wrap;
        gap: 2px var(--space-md);
        font-size: 12px;
        color: var(--text-2);
      }
      .pmeta b {
        color: var(--text);
        font-weight: 600;
      }
      .pmeta .pb {
        color: var(--s-built);
      }
      .pmeta .pa {
        color: var(--accent-text);
      }
      .pmeta .pbad {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-weight: 600;
        color: var(--c);
      }
      .pmeta .pbad svg {
        width: 11px;
        height: 11px;
      }
      .risk {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: var(--space-sm);
        padding: 1px 7px;
        border-radius: var(--radius-sm);
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--s-blocked);
        background: color-mix(in oklch, var(--s-blocked) 16%, var(--surface));
        vertical-align: middle;
      }
      .risk svg {
        width: 11px;
        height: 11px;
      }

      /* phase detail */
      .pd-grid {
        display: grid;
        gap: var(--space-lg) var(--space-xl);
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 860px) {
        .pd-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .pd-block {
        min-width: 0;
      }
      .pd-block .txt,
      .pd-block li {
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .pd-block ol,
      .pd-block ul {
        margin: 0;
        padding-left: 20px;
        display: grid;
        gap: 6px;
      }
      .pd-block .quiet-note {
        margin: 0;
        font-size: 13px;
        color: var(--text-3);
      }
      .pd-cp {
        margin: 0 0 var(--space-sm);
        font-size: 13px;
        color: var(--text-2);
      }
      .panel-head .pid {
        font-size: 14px;
        color: var(--accent-text);
      }
      .panel-head .hint {
        font-size: 12px;
        color: var(--text-3);
      }

      /* attention panels */
      .attn {
        border: 1px solid var(--s-failed);
        background: color-mix(in oklch, var(--s-failed) 10%, var(--surface));
      }
      .stuckitem + .stuckitem {
        margin-top: var(--space-md);
      }
      .kv {
        display: grid;
        gap: 2px;
        font-size: 14px;
      }
      .kv > span:first-child {
        font-size: 12px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .stuckitem {
        padding: var(--space-md);
        background: var(--bg);
        border-radius: var(--radius-sm);
        display: grid;
        gap: var(--space-xs);
      }

      /* questions: one bordered list, divided rows */
      .id {
        font-family: var(--font-mono);
        color: var(--accent-text);
        font-weight: 500;
      }
      .panel-head.qhead {
        align-items: center;
      }
      .panel-head.qhead.shut {
        margin-bottom: 0;
      }
      .count.badge {
        padding: 1px 8px;
        border-radius: 99px;
        background: var(--accent-soft);
        color: var(--accent-text);
        font-weight: 600;
      }
      .qlist {
        border: 1px solid var(--accent);
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .qrow {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: var(--space-sm);
        align-items: start;
        padding-right: var(--space-md);
      }
      .qrow + .qrow {
        border-top: 1px solid var(--line);
      }
      .qrow.open {
        background: color-mix(in oklch, var(--accent-soft) 35%, var(--surface));
      }
      .qtoggle {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: var(--space-sm);
        align-items: start;
        min-height: 56px;
        padding: var(--space-md) 0 var(--space-md) var(--space-md);
      }
      .qtoggle:hover {
        background: var(--surface-2);
      }
      .qtoggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .qchev {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-top: 1px;
        color: var(--text-3);
        transition: transform 0.2s var(--ease);
      }
      .qtoggle[aria-expanded='true'] .qchev {
        transform: rotate(90deg);
      }
      .qmain {
        display: grid;
        gap: 2px;
        min-width: 0;
      }
      .qmeta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--space-xs) var(--space-sm);
        font-size: 12px;
        color: var(--text-3);
      }
      .qmeta .id {
        font-size: 13px;
      }
      .qtext {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
        font-size: 14px;
      }
      .qrow.open .qtext {
        display: block;
        -webkit-line-clamp: unset;
        line-clamp: unset;
      }
      .qact {
        display: flex;
        gap: var(--space-sm);
        align-items: center;
        align-self: start;
        padding: 10px 0;
      }
      .qdetail {
        grid-column: 1/-1;
        display: grid;
        gap: var(--space-sm);
        padding: 0 0 var(--space-md) calc(var(--space-md) + 20px + var(--space-sm));
      }
      .qdetail[hidden] {
        display: none;
      }
      .qhint {
        margin: 0;
        font-size: 13px;
        color: var(--text-3);
      }
      .qdonebar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-sm);
        margin-top: var(--space-sm);
        font-size: 13px;
      }
      .qdonebar > .btn.quiet:first-child {
        margin-inline-start: calc(-1 * var(--space-md));
      }
      .qdonelist {
        list-style: none;
        margin: var(--space-xs) 0 0;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .qdonelist li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--space-sm);
        align-items: center;
        padding: var(--space-sm) var(--space-md);
      }
      .qdonelist li + li {
        border-top: 1px solid var(--line);
      }
      .qdonelist .qclamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 1;
        line-clamp: 1;
        overflow: hidden;
        overflow-wrap: anywhere;
        font-size: 14px;
      }
      .qdonelist .sub {
        font-size: 12px;
        color: var(--text-3);
      }
      .qempty {
        margin: 0;
        padding: var(--space-md) var(--space-lg);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        color: var(--text-2);
        font-size: 14px;
      }

      /* feed: deliverables | activity */
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--space-md);
      }
      .feed {
        display: grid;
        gap: var(--space-2xl);
        margin-top: var(--space-2xl);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
      .feed > section.panel {
        margin-top: 0;
        min-width: 0;
      }
      @media (min-width: 1000px) {
        .feed {
          grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        }
      }

      /* shared bits */
      .tag {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.4;
        padding: 1px 6px;
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--accent-text);
        white-space: nowrap;
      }
      .tag.more-tag {
        color: var(--text-3);
      }
      .txt {
        display: block;
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        max-width: 75ch;
      }
      .txtbtn {
        all: unset;
        box-sizing: border-box;
        display: grid;
        gap: 2px;
        align-content: start;
        width: 100%;
        min-height: 36px;
        cursor: pointer;
        border-radius: var(--radius-sm);
      }
      .txtbtn .txt {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .txtbtn.l3 .txt {
        -webkit-line-clamp: 3;
        line-clamp: 3;
      }
      .txtbtn[aria-expanded='true'] .txt {
        display: block;
        overflow: visible;
      }
      .txtbtn .hint {
        font-size: 12px;
        color: var(--accent-text);
      }
      .txtbtn:hover .hint {
        text-decoration: underline;
      }
      .txtbtn:disabled {
        cursor: default;
        min-height: 0;
      }
      .txtbtn:disabled .hint {
        display: none;
      }
      .txtbtn:focus-visible,
      .more:focus-visible,
      .docs a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .more {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 4px 12px;
        border-radius: var(--radius-sm);
        border: 1px dashed var(--line);
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        font-size: 13px;
        transition:
          border-color 0.15s var(--ease),
          color 0.15s var(--ease);
      }
      .more:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .more.block {
        display: flex;
        width: 100%;
        margin-top: var(--space-md);
      }
      .more.fmore {
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .files {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .file {
        font-family: var(--font-mono);
        font-size: 12px;
        background: var(--bg);
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        color: var(--text-2);
        overflow-wrap: anywhere;
        max-width: 100%;
      }

      /* deliverables */
      .list.dl {
        gap: var(--space-lg);
      }
      .deliv {
        display: grid;
        gap: var(--space-sm);
        padding-bottom: var(--space-lg);
        border-bottom: 1px solid var(--line);
      }
      .deliv:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .deliv .txt {
        color: var(--text);
      }
      .deliv:first-child > .txtbtn .txt,
      .deliv:first-child > .txt {
        font-weight: 600;
      }
      .deliv-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-sm);
        font-size: 12px;
        color: var(--text-3);
      }

      /* activity timeline */
      .tl {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--space-lg);
      }
      .tl h3.day {
        margin: 0 0 var(--space-sm);
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-3);
      }
      .evs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .ev {
        position: relative;
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        gap: var(--space-md);
        padding-bottom: var(--space-xs);
      }
      .ev::before {
        content: '';
        position: absolute;
        left: 9.5px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--line);
      }
      .ev:first-child::before {
        top: 14px;
      }
      .ev:last-child::before {
        bottom: calc(100% - 14px);
      }
      .ev-dot {
        position: relative;
        z-index: 1;
        margin-top: 5px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in oklch, var(--c) 22%, var(--surface));
        color: var(--c);
      }
      .ev-dot svg {
        width: 12px;
        height: 12px;
      }
      .ev.dashed .ev-dot {
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--c);
      }
      .ev.dashed .ev-dot svg {
        stroke-dasharray: 2 2;
      }
      .ev-body {
        display: grid;
        gap: 2px;
        min-width: 0;
        padding: var(--space-xs) var(--space-sm);
        border-radius: var(--radius-sm);
      }
      .ev.tint .ev-body {
        background: color-mix(in oklch, var(--c) 11%, var(--surface));
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--c) 40%, transparent);
      }
      .ev-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-sm);
        font-size: 13px;
        min-height: 22px;
      }
      .ev-label {
        font-weight: 600;
        color: var(--c);
      }
      .ev-head time {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
      }
      .ev .txt {
        color: var(--text-2);
      }
      .ev.tint .txt {
        color: var(--text);
      }

      /* commits: one card per phase, divided rows */
      .cgroups {
        display: grid;
        gap: var(--space-lg);
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
        align-items: start;
      }
      .cgroup {
        padding: var(--space-md) var(--space-lg) var(--space-lg);
      }
      .cgroup > h3 {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px var(--space-sm);
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
        margin-bottom: var(--space-xs);
      }
      .cgroup > h3 .count {
        font-weight: 400;
        font-size: 12px;
      }
      .crows {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .crow {
        display: grid;
        gap: 6px;
        padding: var(--space-md) 0;
        border-top: 1px solid var(--line);
      }
      .crow:first-child {
        border-top: 0;
      }
      .crow.bad {
        border: 1px solid var(--s-failed);
        background: color-mix(in oklch, var(--s-failed) 10%, var(--surface));
        border-radius: var(--radius);
        padding: var(--space-md);
        margin-top: var(--space-sm);
      }
      .chead {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-sm);
        font-size: 12px;
        color: var(--text-3);
      }
      .chead time {
        margin-left: auto;
        white-space: nowrap;
      }
      .chead .branch {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-2);
        overflow-wrap: anywhere;
      }
      a.tag {
        text-decoration: none;
      }
      a.tag:hover {
        text-decoration: underline;
      }
      .csubject {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .cmeta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-xs) var(--space-md);
        font-size: 12px;
        color: var(--text-2);
      }
      .cdiff {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .cdiff .p {
        color: var(--s-verified);
      }
      .cdiff .m {
        color: var(--s-failed);
      }
      .cevid {
        margin: 0;
        font-size: 12px;
        color: var(--text-3);
        overflow-wrap: anywhere;
      }
      .cerr {
        margin: 0;
        font-size: 13px;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .cerr b {
        color: var(--s-failed);
      }

      /* tasks: toolbar */
      .tb {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-md) var(--space-xl);
        align-items: center;
        margin-bottom: var(--space-sm);
      }
      .fbar {
        display: contents;
      }
      .search {
        flex: 0 1 320px;
        min-width: 0;
        min-height: 44px;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .search::placeholder {
        color: var(--text-3);
      }
      .fgroup {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .fgroup .lbl {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-right: 2px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 3px 10px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-2);
        transition:
          background 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .chip:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .chip[aria-pressed='true'] {
        background: color-mix(in oklch, var(--accent) 22%, var(--surface));
        border-color: var(--accent);
        color: var(--text);
      }
      .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
        flex: none;
      }
      .chip .n {
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .chip.ph {
        min-width: 36px;
        justify-content: center;
        padding-inline: 8px;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .sum {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        align-items: center;
        min-height: 32px;
        font-size: 13px;
        color: var(--text-2);
      }
      .tok {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 3px 8px 3px 12px;
        border-radius: 99px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
        background: color-mix(in oklch, var(--accent) 14%, var(--surface));
        border: 1px solid color-mix(in oklch, var(--accent) 55%, var(--line));
      }
      .tok:hover {
        border-color: var(--accent);
      }
      .tok svg {
        width: 12px;
        height: 12px;
        flex: none;
      }
      .linkbtn {
        min-height: 32px;
        padding: 0 var(--space-sm);
        background: none;
        border: 0;
        cursor: pointer;
        font-size: 13px;
        color: var(--accent-text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .linkbtn:hover {
        color: var(--text);
      }
      .plancheck {
        margin: var(--space-sm) 0;
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--s-blocked);
        background: color-mix(in oklch, var(--s-blocked) 10%, var(--surface));
        border-radius: var(--radius);
        font-size: 13px;
        color: var(--text-2);
      }
      .plancheck button {
        all: unset;
        cursor: pointer;
        color: var(--accent-text);
        text-decoration: underline;
        font-family: var(--font-mono);
      }

      /* tasks: groups and rows */
      .phgroup {
        margin-top: var(--space-sm);
        border-top: 1px solid var(--line);
      }
      .phgroup > h3 {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px var(--space-md);
        margin-bottom: 0;
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
      }
      .ghbtn {
        display: flex;
        align-items: center;
        gap: var(--space-sm) var(--space-md);
        width: 100%;
        min-height: 44px;
        padding: 0;
        background: none;
        border: 0;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .ghbtn .chev {
        align-self: center;
        color: var(--text-3);
        transition: transform 0.2s var(--ease);
      }
      .ghbtn[aria-expanded='true'] .chev {
        transform: rotate(90deg);
      }
      .ghbtn:hover {
        color: var(--text);
      }
      .phgroup .ghc {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .phgroup .ghc .gb {
        color: var(--s-built);
      }
      .trows {
        display: grid;
        gap: 6px;
      }
      .task {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        transition: border-color 0.15s var(--ease);
      }
      .task.open {
        border-color: color-mix(in oklch, var(--accent) 45%, var(--line));
        background: color-mix(in oklch, var(--accent) 4%, var(--surface));
      }
      .task > button {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: grid;
        width: 100%;
        min-height: 48px;
        padding: var(--space-sm) var(--space-lg) var(--space-sm) var(--space-md);
        gap: 2px var(--space-md);
        align-items: center;
        border-radius: var(--radius);
        grid-template-columns: 16px 52px minmax(0, 1fr) auto auto;
        grid-template-areas: 'chev tid tt meta stat';
      }
      .task > button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .task:not(.open) > button:hover {
        background: var(--surface-2);
      }
      .task.open > button {
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .task.open > button:hover {
        background: color-mix(in oklch, var(--surface-2) 40%, transparent);
      }
      .task .chev {
        grid-area: chev;
        color: var(--text-3);
        transition: transform 0.2s var(--ease);
      }
      .task.open .chev {
        transform: rotate(90deg);
        color: var(--accent-text);
      }
      .task .tid {
        grid-area: tid;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--accent-text);
      }
      .task .tt {
        grid-area: tt;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .task .meta {
        grid-area: meta;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        align-items: center;
        justify-content: flex-end;
      }
      .task .stat {
        grid-area: stat;
        justify-self: end;
      }
      .ktag {
        font-size: 11px;
        line-height: 1.5;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        color: var(--text-3);
        white-space: nowrap;
      }
      .cnt {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
        white-space: nowrap;
      }
      .task .detail {
        display: none;
        margin: 0 var(--space-lg) 0 var(--space-md);
        padding: var(--space-md) 0 var(--space-lg);
        border-top: 1px solid var(--line);
        gap: var(--space-md) var(--space-xl);
        grid-template-columns: minmax(0, 1fr);
      }
      .task.open .detail {
        display: grid;
      }
      @media (min-width: 720px) {
        .task .detail {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .task .detail .wide {
          grid-column: 1/-1;
        }
      }
      .task .kv {
        gap: 6px;
        align-content: start;
      }
      .task .kv > span:first-child {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .task .stamp {
        font-size: 12px;
        color: var(--text-3);
      }
      .deps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .dep {
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--text-2);
      }
      .dep.ok {
        color: var(--s-verified);
        background: color-mix(in oklch, var(--s-verified) 14%, var(--bg));
      }
      .dep.warn {
        color: var(--s-blocked);
      }
      .note {
        font-size: 13px;
        font-style: italic;
        color: var(--text-3);
      }
      .bul {
        margin: 0;
        padding-left: 20px;
        display: grid;
        gap: 4px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .cmds {
        display: grid;
        gap: var(--space-sm);
        min-width: 0;
      }
      .cmdrow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--space-sm);
        align-items: start;
      }
      .cmdtxt {
        display: block;
        min-width: 0;
        max-height: 16em;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .cmdtxt.clamp {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
      }
      .cmdact {
        display: grid;
        gap: 2px;

            '</span>' +
            tags(a.tasks) +
            when(a.at) +
            '</div>' +
            (text ? clampText(key, text, 2) : '') +
            '</div></li>'
          );
        }
        function activity(d) {
          var l = d.activity || [],
            shown = state.ui.actAll ? l : l.slice(0, ACT_CAP),
            groups = groupByDay(shown);
          var count =
            l.length > ACT_CAP && !state.ui.actAll
              ? 'Showing ' + ACT_CAP + ' of ' + l.length
              : l.length + (l.length === 1 ? ' event' : ' events');
          return (
            '<section class="panel" aria-labelledby="h-ac"><div class="panel-head"><h2 id="h-ac">Activity</h2>' +
            (l.length ? '<span class="count">' + count + '</span>' : '') +
            '</div>' +
            (l.length
              ? '<div class="card"><ol class="tl">' +
                groups
                  .map(function (g) {
                    return (
                      '<li>' +
                      (groups.length > 1 ? '<h3 class="day">' + esc(g.label) + '</h3>' : '') +
                      '<ol class="evs">' +
                      g.items
                        .map(function (a) {
                          return eventRow(a, d);
                        })
                        .join('') +
                      '</ol></li>'
                    );
                  })
                  .join('') +
                '</ol>' +
                showAllBtn('act', l.length, ACT_CAP) +
                '</div>'
              : '<p class="muted" style="margin:0">No events logged yet.</p>') +
            '</section>'
          );
        }

        /* commits: grouped by phase, groups ordered by their newest commit; evidence may be a string, list or object */
        function flatEvidence(e) {
          if (e == null || e === '') return '';
          if (Array.isArray(e)) return e.map(flatEvidence).filter(Boolean).join(' · ');
          if (typeof e === 'object')
            return Object.keys(e)
              .map(function (k) {
                return k + ': ' + flatEvidence(e[k]);
              })
              .join(' · ');
          return String(e);
        }
        function commitPill(c) {
          if (c.missing)
            return (
              '<span class="pill st-blocked">' +
              icon('blocked') +
              'commit not found (rebased?)</span>'
            );
          if (c.ok === false)
            return '<span class="pill st-failed">' + icon('failed') + 'failed</span>';
          return c.pushed
            ? '<span class="pill st-verified">' + icon('pushed') + 'pushed</span>'
            : '<span class="pill st-queued">' + icon('queued') + 'local only</span>';
        }
        function commitRow(c) {
          var sha = c.shortSha || (c.sha ? String(c.sha).slice(0, 7) : 'no sha'),
            failed = c.ok === false && !c.missing;
          var shaTag = c.url
            ? '<a class="tag" href="' +
              esc(c.url) +
              '" target="_blank" rel="noopener" aria-label="Commit ' +
              esc(sha) +
              ' (opens in new tab)">' +
              esc(sha) +
              '</a>'
            : '<span class="tag">' + esc(sha) + '</span>';
          var diff =
            !c.missing && c.filesChanged != null
              ? '<span class="cdiff">' +
                c.filesChanged +
                (c.filesChanged === 1 ? ' file' : ' files') +
                ' · <span class="p">+' +
                (c.added || 0) +
                '</span> / <span class="m">&minus;' +
                (c.removed || 0) +
                '</span></span>'
              : '';
          var ev = flatEvidence(c.evidence);
          return (
            '<li class="crow' +
            (failed ? ' bad' : '') +
            '"><div class="chead">' +
            shaTag +
            commitPill(c) +
            (c.branch ? '<span class="branch">' + esc(c.branch) + '</span>' : '') +
            when(c.at || c.committedAt) +
            '</div>' +
            '<p class="csubject" title="' +
            esc(c.subject || '') +
            '">' +
            esc(c.subject || '(no subject)') +
            '</p>' +
            '<div class="cmeta">' +
            (c.attempt ? '<span>verified on attempt ' + esc(c.attempt) + '/3</span>' : '') +
            tags(c.tasks) +
            diff +
            '</div>' +
            (ev ? '<p class="cevid">' + esc(ev) + '</p>' : '') +
            (failed && c.error ? '<p class="cerr"><b>Error:</b> ' + esc(c.error) + '</p>' : '') +
            '</li>'
          );
        }
        function commits(d) {
          var l = d.commits || [];
          if (!l.length) return '';
          var order = [],
            by = {};
          l.forEach(function (c) {
            var k = String(c.phase);
            if (!by[k]) {
              by[k] = [];
              order.push(k);
            }
            by[k].push(c);
          });
          return (
            '<section class="panel" aria-labelledby="h-cm"><div class="panel-head"><h2 id="h-cm">Commits</h2><span class="count">' +
            l.length +
            '</span></div><div class="cgroups">' +
            order
              .map(function (k) {
                var p = phaseById(d, k),
                  items = by[k],
                  key = 'cm_' + slug(k),
                  open = !!state.ui.open[key],
                  shown = open ? items : items.slice(0, COMMIT_CAP);
                return (
                  '<div class="card cgroup"><h3><span>' +
                  (p
                    ? 'Phase ' + esc(p.id) + ' &middot; ' + md(splitRisk(p.name).name)
                    : 'Phase ' + esc(k)) +
                  '</span><span class="count">' +
                  items.length +
                  '</span></h3><ul class="crows">' +
                  shown.map(commitRow).join('') +
                  '</ul>' +
                  (items.length > COMMIT_CAP
                    ? '<button type="button" class="more block" data-expand="' +
                      key +
                      '" data-fid="x:' +
                      key +
                      '" aria-expanded="' +
                      open +
                      '">' +
                      (open ? 'Show latest ' + COMMIT_CAP : 'Show all ' + items.length) +
                      '</button>'
                    : '') +
                  '</div>'
                );
              })
              .join('') +
            '</div></section>'
          );
        }
        function docs(d) {
          var l = d.docs || [];
          return (
            '<section class="panel" aria-labelledby="h-dc"><div class="panel-head"><h2 id="h-dc">Docs</h2></div>' +
            (l.length
              ? '<div class="docs">' +
                l
                  .map(function (x) {
                    return (
                      '<a href="' +
                      esc(x.href) +
                      '" target="_blank" rel="noopener" title="' +
                      esc(x.source) +
                      '" aria-label="' +
                      esc(x.name) +
                      ' (opens in new tab)"><span>' +
                      esc(x.name) +
                      '</span>' +
                      EXT_ICON +
                      '</a>'
                    );
                  })
                  .join('') +
                '</div>'
              : '<p class="muted" style="margin:0">No docs linked.</p>') +
            '<p class="muted mono" style="margin-top:12px;overflow-wrap:anywhere">Tasks file: ' +
            esc((d.projectRoot ? d.projectRoot + '/' : '') + d.tasksFile) +
            '</p></section>'
          );
        }
        function bottomHtml(d) {
          return (
            '<div class="feed">' + deliverables(d) + activity(d) + '</div>' + commits(d) + docs(d)
          );
        }
        function fitClamps() {
          var btns = document.querySelectorAll('.txtbtn[data-expand]');
          Array.prototype.forEach.call(btns, function (b) {
            var open = b.getAttribute('aria-expanded') === 'true';
            var t = b.querySelector('.txt');
            var truncates = open || t.scrollHeight > t.clientHeight + 1;
            b.disabled = !truncates;
            if (!truncates) b.removeAttribute('aria-expanded');
            else b.setAttribute('aria-expanded', open);
          });
        }

        /* ---------- render ---------- */
        var searchEl = null,
          listEl = null,
          filtersEl = null;
        function buildShell() {
          var app = document.getElementById('app');
          app.innerHTML =
            '<div id="top"></div><section class="panel" id="tasks" aria-labelledby="h-tk"><div class="panel-head"><h2 id="h-tk">All tasks</h2></div>' +
            '<div class="tb"><input class="search" type="search" id="q" placeholder="Search id, title, file or Gherkin" aria-label="Search tasks"><div id="filters" class="fbar"></div></div>' +
            '<div id="list"></div></section><div id="bottom"></div>';
          searchEl = document.getElementById('q');
          listEl = document.getElementById('list');
          filtersEl = document.getElementById('filters');
          searchEl.value = state.filters.q;
          searchEl.addEventListener('input', function () {
            state.filters.q = searchEl.value;
            persist();
            renderList(window.DASHBOARD);
          });
        }
        function renderList(d) {
          var r = tasksList(d);
          filtersEl.innerHTML = r.filters;
          listEl.innerHTML = r.html;
        }

        function activeFid() {
          var a = document.activeElement;
          return a && a.getAttribute ? a.getAttribute('data-fid') : null;
        }
        function restoreFocus(fid) {
          if (!fid) return;
          var nodes = document.querySelectorAll('[data-fid]'),
            i;
          for (i = 0; i < nodes.length; i++) {
            if (nodes[i].getAttribute('data-fid') !== fid) continue;
            if (nodes[i] !== document.activeElement) nodes[i].focus({ preventScroll: true });
            return;
          }
        }

        function render(data) {
          var fatal = document.getElementById('fatal'),
            app = document.getElementById('app');
          if (!data) {
            fatal.style.display = 'block';
            fatal.innerHTML = emptyState();
            app.style.display = 'none';
            return;
          }
          var fid = state.fid || activeFid();
          state.fid = null;
          fatal.style.display = 'none';
          app.style.display = '';
          if (!searchEl || !document.body.contains(searchEl)) buildShell();
          /* Questions sit above Now, each a full-width stacked panel; never wrap them in a side-by-side grid. */
          document.getElementById('top').innerHTML =
            header(data) +
            constraint() +
            stuck(data) +
            questions(data) +
            now(data) +
            phases(data) +
            phaseDetail(data);
          renderList(data);
          document.getElementById('bottom').innerHTML = bottomHtml(data);
          renderLightbox(data);
          fitClamps();
          restoreFocus(fid);
        }

        /* ---------- events (delegated; survive re-render) ---------- */
        function copyText(el) {
          var key = el.dataset.key;
          var done = function () {
            state.copied[key] = true;
            render(window.DASHBOARD);
            setTimeout(function () {
              delete state.copied[key];
              render(window.DASHBOARD);
            }, COPIED_MS);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(el.dataset.copy).then(done, function (err) {
              console.warn('clipboard failed', err);
            });
            return;
          }
          var ta = document.createElement('textarea');
          ta.value = el.dataset.copy;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            done();
          } catch (err) {
            console.warn('copy failed', err);
          }
          ta.remove();
        }
        /* open a task row from anywhere: clear filters only when they would hide it, unfold its group, then scroll to it */
        function jumpToTask(id) {
          var d = window.DASHBOARD,
            t = taskById(d, id),
            pid = taskIdx.phase[id];
          if (!t) return;
          var p = phaseById(d, pid);
          if (isFiltering() && p && !matches(t, p)) {
            state.filters = { q: '', status: [], kind: [], phase: [] };
            if (searchEl) searchEl.value = '';
            persist();
          }
          if (isFiltering()) state.ui.grpF[pid] = true;
          else state.ui.grp[pid] = true;
          state.ui.lightbox = null;
          state.expanded[id] = true;
          state.fid = 'task:' + id;
          render(d);
          var row = document.querySelector(
            '.task[data-tid="' + String(id).replace(/"/g, '') + '"]',
          );
          if (row) row.scrollIntoView({ block: 'center' });
        }
        document.addEventListener('click', function (e) {
          var el = e.target.closest(
            '[data-copy],[data-shot],[data-lbclose],[data-lbnav],[data-lbback],[data-f],[data-phase],[data-task],[data-jump],[data-clear],[data-clearq],[data-more],[data-expand],[data-grp],[data-qpanel],[data-qtoggle],[data-qdone],[data-qdone-all],[data-qrestore],[data-qrestore-all],[data-qshowdone]',
          );
          if (!el) return;
          var ds = el.dataset;
          /* specific controls first; the generic task toggle is last so nothing nested can be swallowed by it */
          if (ds.copy != null) {
            copyText(el);
            return;
          }
          if (ds.lbback) {
            if (e.target === el) closeLightbox();
            return;
          }
          if (ds.lbclose) {
            closeLightbox();
            return;
          }
          if (ds.lbnav) {
            stepLightbox(Number(ds.lbnav));
            return;
          }
          if (ds.shot) {
            openLightbox(el);
            return;
          }
          if (handleQuestionClick(el)) return;
          if (ds.jump) {
            jumpToTask(ds.jump);
            return;
          }
          if (ds.more) {
            var flag = ds.more + 'All';
            state.ui[flag] = !state.ui[flag];
            state.fid = el.getAttribute('data-fid');
            render(window.DASHBOARD);
            return;
          }
          if (ds.grp) {
            (isFiltering() ? state.ui.grpF : state.ui.grp)[ds.grp] =
              el.getAttribute('aria-expanded') !== 'true';
            state.fid = el.getAttribute('data-fid');
            render(window.DASHBOARD);
            return;
          }
          if (ds.expand) {
            state.ui.open[ds.expand] = !state.ui.open[ds.expand];
            state.fid = el.getAttribute('data-fid');
            render(window.DASHBOARD);
            return;
          }
          if (ds.clearq) {
            state.filters.q = '';
            searchEl.value = '';
            persist();
            render(window.DASHBOARD);
            return;
          }
          if (ds.clear) {
            state.filters = { q: '', status: [], kind: [], phase: [] };
            searchEl.value = '';
            persist();
            render(window.DASHBOARD);
            return;
          }
          if (ds.f) {
            toggle(state.filters[ds.f], ds.v);
            persist();
            state.fid = 'f:' + ds.f + ':' + ds.v;
            render(window.DASHBOARD);
            return;
          }
          if (ds.phase) {
            /* single-select, independent of the task filters; no scroll so the page stays put */
            state.selPhase = String(state.selPhase) === ds.phase ? null : ds.phase;
            render(window.DASHBOARD);
            return;
          }
          if (ds.task) {
            var id = ds.task;
            state.expanded[id] = !state.expanded[id];
            var row = el.closest('.task');
            row.classList.toggle('open', !!state.expanded[id]);
            el.setAttribute('aria-expanded', !!state.expanded[id]);
          }
        });
        document.addEventListener("keydown", function (e) {
    if (!state.ui.lightbox) return;
    if (e.key === "Escape") { e.preventDefault(); closeLightbox(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") stepLightbox(e.key === "ArrowLeft" ? -1 : 1);
    else if (e.key === "Tab") trapTab(e);
  });
  /* error events don't bubble, so listen in the capture phase; a missing file shows a muted label instead of a broken icon */
  document.addEventListener("error", function (e) {
    if (e.target.classList && e.target.classList.contains("shot-img")) e.target.parentNode.classList.add("broken");
  }, true);
        window.addEventListener('resize', fitClamps);

        /* ---------- refresh: swap the data.js script tag, re-render, no page reload ---------- */
        function loadData() {
          var old = document.getElementById('data-script');
          if (old) old.remove();
          var s = document.createElement('script');
          s.id = 'data-script';
          s.src = 'data.js?t=' + Date.now();
          s.onload = s.onerror = renderIfChanged;
          document.head.appendChild(s);
        }
        var lastSnapshot = null;
        function renderIfChanged() {
          var d = window.DASHBOARD;
          var snap = d ? JSON.stringify(d) + isStalled(d) : '';
          if (snap === lastSnapshot) return;
          lastSnapshot = snap;
          render(window.DASHBOARD);
        }
        function tickTimes() {
          var els = document.querySelectorAll('time[datetime]');
          for (var i = 0; i < els.length; i++)
            els[i].textContent = ago(els[i].getAttribute('datetime'));
          renderIfChanged();
        }
        loadData();
        setInterval(loadData, REFRESH_MS);
        setInterval(tickTimes, TICK_MS);
      })();
    </script>
  </body>
</html>
