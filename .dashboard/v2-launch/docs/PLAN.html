<script>document.getElementById("doc").innerHTML = marked.parse("# Implementation Plan: Visual AI V2 Launch Bundle\n\nSource: `SPEC.md` (final). Order (user-confirmed): P1 Modifications, P2 Speech-to-text, P3 V2 intro, P4 V2 email.\nRules: no dev server is ever started (it is always running); browser checks use the `agent-browser` skill; never commit unless told; no Claude attribution.\nCommands: `bun run test`, `bun --cwd apps/api run test`, `bun run verify`, `bun run check`, `bun run check:model-docs`, `bun --cwd packages/shared run build`, `bun run build:web`.\n\n## Architecture decisions\n\n- Shared constants (credits, image limits, intro version, STT limits) live in `packages/shared`; any change requires `bun --cwd packages/shared run build` because `apps/api` consumes `dist`.\n- Reference images: upload to Cloudinary first (`POST /generate/reference-images`), then pass `referenceImageUrls[]` in the existing JSON body. Buffers cannot travel through the queue (`apps/api/src/queue/`).\n- Replicate input shape is an explicit registry flag `imageInput.array`, never inferred from `max`.\n- Intro state: DB `seenIntroVersion` plus localStorage guard. Email: separate `packages/email` workspace, no web coupling.\n- Real mail send is gated behind `--confirm`; this plan never sends to real recipients.\n\n## Verified code anchors\n\n- `apps/api/src/routes/users.ts:176,190` hardcode `credits: 50`; `routes/generate.ts` (no multer on `/generate/image`); `services/generation-service.ts:353`; `lib/model-input.ts:142`; `middlewares/multer.ts`; `config/redis.ts`, `config/env.ts`.\n- Web: `components/Dashboard/Composer/{PromptBar,ComposerTextarea,ReferenceImageControl}.vue`, `stores/aside.ts`, `stores/generate.ts`, `components/Header/UserMenu.vue`, `components/AppModal.vue`, `components/ReferralCode.vue`, `components/Header/{CreditsChip,UserMenu}.vue`, `components/Dashboard/ModelPicker/ModelPickerTrigger.vue`, `components/Dashboard/DashboardShell.vue`. Referral dialogs are in `components/Dialogs/` (`ReferralOfferDialog.vue`, `ReferralCopyDialog.vue`, `ReferralDialog.vue`, each with a co-located `.test.ts`).\n- Shared: `ModelDefinition.fields.imageInput` in `packages/shared/src/models/types.ts` (~77), entries in `models/registry.ts`. Queue: `apps/api/src/queue/{generation-queue,generation-worker}.ts`.\n- Routing: API routes mount at `/` (no `/api` prefix; web uses `VITE_API_BASEPATH`). `routes/index.ts:16` mounts `generateRoute` before auth (new generate endpoints apply `requireAuth` themselves); line 19 onward applies `requireAuth` to every later request, so public routes go above it.\n- Test layout: co-located `*.test.ts`; web and api enforce 90% coverage thresholds; API vitest collects only `src/**/*.test.ts`. E2E uses the seeded QA harness `apps/web/e2e/qa/*.spec.ts` (fixtures `e2e/fixtures/qa.ts`; no `qa-seed.init.js`).\n- No `apps/api/scripts/` code besides `copy-env.sh`; no `packages/email` yet. The API loads env with `dotenv/config` from cwd, so the send script runs from `apps/api`.\n\n## Task ID mapping (PLAN task → TASKS.md ids)\n\nPLAN tasks are coarse; TASKS.md splits them into ≤5-file tasks and adds Unit/E2E/gate tasks.\n| PLAN | TASKS |\n|---|---|\n| Phase 0 (conventions) | T0.1 e2e prod-server mode, T0.2 gitignore (both `gate` kind, see TASKS Phase 0 note) |\n| 1.1 credits | T1.1 |\n| 1.2 copy | T1.2 (web source), T1.3 (static files, stale assertions, prerender) |\n| 1.3 upload endpoint + shared limits | T1.4 |\n| 1.4 URLs reach Replicate | T1.5 (registry flag + input shaping), T1.6 (route, queue, service) |\n| 1.5 multi-image UI + 1.6 trim | T1.7 (stores, incl. trim), T1.8 (prompt bar UI) |\n| 1.7 favicon | T1.9 |\n| 1.8 referral dialog | T1.10 |\n| P1 tests / gate | T1.11-T1.13 Unit, T1.14-T1.15 E2E, T1.16 Gate |\n| 2.1 STT API | T2.1 (constants, limiter, env), T2.2 (route) |\n| 2.2 Grok path | T2.3 (also adds `data-tour=\"mic\"`) |\n| 2.3 Web Speech | T2.4 |\n| 2.4 waveform/a11y | T2.5 |\n| 2.5 e2e, P2 gate | T2.6-T2.8 Unit, T2.9 E2E, T2.10 Gate |\n| 3.1 intro-seen | T3.1 |\n| 3.2 show rule + shell | T3.2 |\n| 3.3 tour | T3.3 (data-tour anchors), T3.4 (driver.js tour, custom popover) |\n| 3.4 STT polish | T3.5 |\n| 3.5 video loops (last) | T3.6 |\n| 3.6 e2e, P3 tests / gate | T3.7-T3.10 Unit, T3.11-T3.12 E2E, T3.13 Gate |\n| 4.1 scaffold | T4.1 |\n| 4.2 unsubscribe | T4.2 (token, User fields, env), T4.3 (public route) |\n| 4.3 script core | T4.4 |\n| 4.5 modes | T4.5 |\n| 4.4 template | T4.6 |\n| P4 tests / gate | T4.7-T4.9 Unit, T4.10 E2E, T4.11 Gate |\n| DoD | T5.1 |\n\n## Dependency graph (TASKS.md ids)\n\n```\ncredits constants (T1.1) --> web copy (T1.2) --> static copy/tests (T1.3) --> referral dialog (T1.10)\nshared limits + upload endpoint (T1.4) --> registry flag/input shape (T1.5) --> route/queue/service (T1.6) --> stores incl. trim (T1.7) --> prompt bar UI (T1.8)\nfavicon (T1.9) independent\nP1 (UI final) --> P2 (mic, T2.3 adds data-tour=\"mic\") --> P3 anchors (T3.3) --> tour (T3.4) --> STT polish (T3.5) --> video loops (T3.6, last)\nP4: T4.1 scaffold, T4.2-T4.3 unsubscribe, T4.4-T4.5 script need only P1; T4.6 template needs P3 copy/media (T3.6)\n```\n\nParallel-safe: T1.9 (favicon) with anything; T4.1-T4.5 with P2/P3. Execution order stays Phase 0 → 1 → 2 → 3 → 4 (user-confirmed).\n\n---\n\n# Phase 1: Modifications\n\n**Goal:** 30-credit grants everywhere (code and copy), working multi-reference-image generation, correct favicon, redesigned referral dialog.\n\n**Files touched:** `packages/shared/src/models/credits.ts`, `packages/shared/src` (new image-limits export), `apps/api/src/routes/{users,generate}.ts` (+tests), `apps/api/src/services/generation-service.ts`, `apps/api/src/lib/model-input.ts`, `apps/api/src/queue/*` (job data type), model registry + `docs/MODEL_ONBOARDING.md`, `apps/web/src/stores/{aside,generate}.ts`, `components/Dashboard/Composer/{PromptBar,ReferenceImageControl}.vue`, `composables/useImageDrop.ts`, Referral dialogs, `utils/featureLandings.ts`, `seo.ts`, `public/{pricing.md,llms.txt,favicon.*,site.webmanifest}`, `index.html`.\n\n**Dependencies:** none (first phase).\n\n### Task 1.1: Credits constants and referral grant (S)\n\n- Description: SIGNUP_CREDITS and REFERRAL_BONUS to 30; replace both `$inc: { credits: 50 }` with `REFERRAL_BONUS`; audit signup path for other literals.\n- AC: new user doc defaults to 30; referral `$inc` equals `REFERRAL_BONUS` for both parties; no migration touches existing users.\n- Verify: `bun --cwd packages/shared run build`; `bun --cwd apps/api run test -- users`; `grep -rn \"credits: 50\" apps/api/src` is empty.\n- Files: `credits.ts`, `routes/users.ts`, `routes/users.test.ts`.\n\n### Task 1.2: Copy derives from constants (M)\n\n- Description: interpolate constants in referral dialogs, FAQ/JSON-LD (`featureLandings.ts`, `seo.ts`); edit static `pricing.md`, `llms.txt`; update tests. Leave `creditPacks.ts` alone.\n- AC: MOD-2 grep returns nothing signup/referral related; tests assert rendered value equals constant.\n- Verify: MOD-2 grep from SPEC; `bun run test`; `bun run check`.\n- Files: dialogs, `featureLandings.ts`, `seo.ts`, `public/pricing.md`, `public/llms.txt`, related tests.\n\n### Task 1.3: Reference image upload endpoint + shared limits (M)\n\n- Description: move `MAX_IMAGE_BYTES` (5 MB) and accepted types into shared; add authenticated `POST /generate/reference-images` (`upload.array(\"images\", max)`), validating type/size/count with the shared constants.\n- AC: 401 unauthenticated; 400 wrong type/oversize/too many; returns Cloudinary URLs; client `useImageDrop.ts` imports shared constants.\n- Verify: API route tests with mocked Cloudinary; `bun run check`.\n- Files: shared, `routes/generate.ts`, `middlewares/multer.ts`, `useImageDrop.ts`, tests.\n\n### Task 1.4: Reference URLs reach Replicate (M, highest risk, do early)\n\n- Description: accept optional `referenceImageUrls[]` on `POST /generate/image`; validate count \u003c= `max ?? 1` and Cloudinary-origin URLs; thread through queue job data and `generation-service.ts` to `buildModelInput`; add registry `imageInput.array`, set per model from verified Replicate schemas (only the `max: 8` model multi until proven); update `MODEL_ONBOARDING.md`.\n- AC: array model gets array, string model gets string; zero images still works; old clients unaffected; invalid URL 400 before credit deduction.\n- Verify: API tests per shape; `bun run check:model-docs`; `bun --cwd apps/api run test`.\n- Files: `routes/generate.ts`, `services/generation-service.ts`, `lib/model-input.ts`, queue types, registry, `docs/MODEL_ONBOARDING.md`, tests.\n\n### Task 1.5: Prompt bar multi-image UI end to end (M)\n\n- Description: root-cause the sidebar model selection vs `aside.mode`/`supportsImageInput` (MOD-3.0); replace `referenceImage` with `referenceImages[]`; thumbnail strip with accessible remove; multi-select when max > 1; over-max inline message; `generate.ts` store uploads then sends URLs; upload failure = error toast, no generation, no credit deduction; revoke object URLs.\n- AC: max-8 model accepts 8 and blocks a 9th; real generation visibly follows a reference; disabled+tooltip state retained for non-imageInput models.\n- Verify: store and control unit tests; `agent-browser` run of a real generation; `bun run test`.\n- Files: `aside.ts`, `generate.ts`, `PromptBar.vue`, `ReferenceImageControl.vue`, tests (5).\n\n### Task 1.6: Model-switch trimming with toasts (S)\n\n- Description: replace silent clear at `aside.ts:152`: lower max trims with toast naming count; no imageInput clears with toast; equal/higher keeps, no toast.\n- AC: all three branches covered by unit tests.\n- Verify: `bun run test -- aside`; agent-browser switch check.\n- Files: `aside.ts`, `aside.test.ts`.\n\n### Checkpoint A (after 1.1-1.6)\n\n- [ ] `bun run test`, `bun run verify`, `bun run check:model-docs`, shared build all green\n- [ ] Browser: reference image flow works; new account shows 30\n\n### Task 1.7: Favicon refresh (S, parallel)\n\n- Description: compare `favicon.ico`, `logo.svg`, `LogoMark.vue`; if stale generate ico/svg/apple-touch/192/512 with `sharp` (dev only); add `site.webmanifest`; version query on `index.html` links.\n- AC: tab icon matches header logo; all referenced files 200; no Lighthouse icon warnings.\n- Verify: agent-browser screenshot of tab/header; `bun run build:web`.\n- Files: `apps/web/public/*`, `apps/web/index.html`.\n\n### Task 1.8: ReferralOfferDialog redesign (M)\n\n- Description: use `impeccable` + `layout` skills on `AppModal.vue`; semantic tokens only; single close affordance; code well with Copy/“Copied” (aria-live, ~2 s); a11y per MOD-5; reward from `REFERRAL_BONUS`.\n- AC: component test (clipboard, feedback, constant value); no hardcoded hex; axe clean; AA contrast; 44px targets.\n- Verify: agent-browser screenshots dark/light and 375px.\n- Files: dialog + test, possibly `AppModal.vue`.\n\n### Checkpoint P1 gate\n\n- [ ] All Phase 1 AC; MOD-2 grep clean; screenshots reviewed with user\n\n**Phase 1 risks:** wrong Replicate array/string shape silently fails (mitigate: per-model schema check + test); shared `dist` stale (always rebuild); favicon caching (version query); sidebar selection may not update `aside.mode`.\n\n---\n\n# Phase 2: Speech-to-text\n\n**Goal:** mic button in the prompt bar with Web Speech and Grok engines, live waveform, robust errors.\n\n**Files touched:** `packages/shared` (STT constants), `apps/api/src/routes/stt.ts` (+test), `routes/index.ts`, `middlewares/rate-limit.ts` (+test), `config/env.ts`, `.env.example`, `apps/web/src/composables/{useVoiceInput,useWebSpeech,useGrokRecorder,useAudioLevel}.ts`, `components/Dashboard/Composer/VoiceInput/*`, `PromptBar.vue`, `ComposerTextarea.vue`, e2e scenario.\n\n**Dependencies:** Phase 1 (PromptBar layout settled). New deps: `express-rate-limit`, `rate-limit-redis` (SPEC-listed; store chosen at runtime). Re-read `/Users/deepakdewani1/Desktop/grok-stt.md` before 2.1.\n\n### Task 2.1: STT API with rate limit (M)\n\n- Description: `POST /stt`, `requireAuth`, audio multer (5 MB), per-user 20/10 min limiter (Redis if configured else memory), xAI call with `file` last, 30 s timeout, returns `{ text }`; 503 if `XAI_API_KEY` unset; no audio/key logging.\n- AC: tests for 401, 429, 413, 400, 502, field order, 503.\n- Verify: `bun --cwd apps/api run test -- stt`; `bun run check`.\n- Files: `stt.ts`, `rate-limit.ts`, `env.ts`, `.env.example`, `routes/index.ts`, tests.\n\n### Task 2.2: Grok recording path in the prompt bar (M, vertical)\n\n- Description: mic button + `useGrokRecorder` (webm/opus, mp4 fallback), \"Transcribing...\" state, append-not-replace, 60 s auto-stop with 10 s countdown, cancel, error mapping toasts (STT-8).\n- AC: with mocked APIs, append, auto-stop (fake timers) and each error branch tested; works in browser against running API.\n- Verify: component tests; agent-browser real dictation in Chrome.\n- Files: `useGrokRecorder.ts`, `useVoiceInput.ts`, `VoiceInput/MicButton.vue`, `PromptBar.vue`, tests.\n\n### Task 2.3: Web Speech engine + engine menu (M)\n\n- Description: `useWebSpeech` continuous with interim preview committed on finalize; chevron menu, localStorage persistence (try/catch), unsupported-browser default to Grok with disabled option text; privacy note about Chrome audio; menu disabled while recording.\n- AC: persistence and fallback tests; Firefox defaults to Grok.\n- Verify: unit tests; agent-browser Chrome interim text; Firefox manual note.\n- Files: `useWebSpeech.ts`, `VoiceInput/EngineMenu.vue`, tests.\n\n### Task 2.4: Waveform and a11y polish (S/M)\n\n- Description: `useAudioLevel` (AnalyserNode + rAF, cleanup of tracks/AudioContext), reduced-motion level meter, aria-live state announcements, Esc cancels, stop on tab hidden/route or model change; fallback indicator if second `getUserMedia` conflicts.\n- AC: no leaked tracks on unmount (test); reduced-motion variant renders.\n- Verify: unit tests; agent-browser visual at 375px dark/light.\n- Files: `useAudioLevel.ts`, `VoiceInput/Waveform.vue`, tests.\n\n### Task 2.5: e2e spec (S)\n\n- Description: seeded QA spec `apps/web/e2e/qa/voice-input.spec.ts` with mocked `getUserMedia`/`MediaRecorder`/`SpeechRecognition` and intercepted `**/stt`.\n- AC: append-not-replace, engine persistence and fallback, error states, Esc/tab-hidden stop, 60 s auto-stop pass with `--repeat-each=3`.\n- Verify: `cd apps/web && bunx playwright test e2e/qa/voice-input.spec.ts --repeat-each=3` (e2e-engineer agent), no server start.\n\n### Phase 2 gate\n\n- [ ] API + component tests green; manual Chrome and Firefox pass; Phase 1 regression suite green\n      **Risks:** dual-stream conflict, Safari mime/iOS quirks, xAI doc drift (confirm formats before launch), Redis availability in prod (memory fallback), user typing during transcribe (append at end).\n\n---\n\n# Phase 3: V2 intro (carousel + tour)\n\n**Goal:** one-time large split \"What's new in V2\" modal per account (10 slides, clickable feature list, icon nav, cropped real-UI video loops) with an optional driver.js tour using a custom token-styled popover; reopenable from the user menu. Also polishes the Phase 2 mic UX (stop icon, pill waveform, spinner, silence handling) before the clips are recorded.\n\n**Files touched:** `packages/shared` (`CURRENT_INTRO_VERSION`, known list; `STT_SILENCE_LEVEL_THRESHOLD` in `models/stt.ts`), User model (`seenIntroVersion`), `routes/users.ts` (+test), `apps/web/src/composables/useIntro.ts`, `components/Intro/{WhatsNewModal,IntroSlide,FeatureList,TourPopover}.vue` (+ `slides.ts`; `IntroSlide` is the video stage), `components/Intro/tour.ts`, `Header/UserMenu.vue`, `data-tour` anchors (`model-picker`, `style-picker`, `sizes`, `prompt-bar`, `mic`, `prompt-tools`, `ref-image`, `explore-tab`) in their owning components, `DashboardShell.vue` mount, STT polish in `components/Dashboard/Composer/VoiceInput/{MicButton,Waveform}.vue`, `composables/{useGrokRecorder,useAudioLevel,useVoiceInput}.ts`, `public/intro/*.{webm,mp4,webp}` (clips + WebP posters), e2e scenarios (`v2-intro.spec.ts`, extend `voice-input.spec.ts`). New dep: `driver.js` (web, stays; react-joyride and GlowTour rejected).\n\n**Dependencies:** Phases 1-2 complete (clips show the final UI). Order by TASKS ids: T3.1 and T3.2 can start before clips; T3.3 anchors -> T3.4 tour -> T3.5 STT polish -> T3.6 clips (last, so the voice clip shows the new mic). PLAN task numbers below differ from TASKS ids; see the mapping table.\n\n**Slides (exactly 10, this order):** 1 New models, 2 Style picker, 3 More sizes, 4 New dashboard, 5 Voice dictation, 6 Improve/Generate/Save prompts, 7 Explore tab and page, 8 Tools (Upscale, Colorize), 9 Reference images, 10 Remove background. No credits slide.\n\n### Task 3.1: Intro-seen persistence (S; TASKS T3.1)\n\n- Description: schema field + `PUT /users/intro-seen` (identity from auth only; 400 unknown version); profile GET returns the field.\n- AC: 401 unauth; writes only caller doc even with body id; 400 unknown version.\n- Verify: `bun --cwd apps/api run test -- users`; shared build.\n- Files: shared, user model, `routes/users.ts`, test.\n\n### Task 3.2: Show rule + modal shell (M, vertical; TASKS T3.2)\n\n- Description: `useIntro` visibility logic (DB flag x localStorage x profile loaded, no flash, two-tab storage event, PUT retry once, delay until dashboard mounted); large split `WhatsNewModal` (~1040x620, max-w clamps to viewport): left ~62% video stage (`IntroSlide`), right column with clickable `FeatureList` (all 10 slides, active highlighted, jump-to), active title + one-line description, footer \"n / 10\" with prev/next chevron icon buttons (clear contrast, aria-labels), header \"What's new in V2\" + Skip/close, no slide bleed; placeholder media; last slide offers \"Show me around\" and \"Done\"; keep a11y (role=dialog, `aria-roledescription=carousel`, live region, arrows, Esc=skip, focus trap, swipe); mobile \u003c640px full-screen sheet with video on top and list collapsed to dots/segmented progress; \"What's new\" item in `UserMenu.vue` (no DB write on reopen).\n- AC: visibility matrix tests; modal shows once per account in browser, reopen works; list jump-to and icon nav work; no neighbouring slide visible; mobile sheet layout holds at 375px.\n- Verify: unit tests; agent-browser new vs seen account, reload, 1440 and 375.\n- Files: `useIntro.ts`, `WhatsNewModal.vue`, `IntroSlide.vue`, `FeatureList.vue`, `slides.ts`, `UserMenu.vue`, `DashboardShell.vue`, tests.\n\n### Task 3.3: Tour anchors and driver.js tour (M; split in TASKS as T3.3 anchors and T3.4 tour)\n\n- Description: T3.3: add `data-tour` attributes in owning components: `model-picker` (`ModelPickerTrigger`), `style-picker`, `sizes` (output settings), `prompt-bar` (`PromptBar`), `mic` (exists from Phase 2), `prompt-tools` (magic/wand menu), `ref-image` (`ReferenceImageControl`), `explore-tab`; `credits`/`user-menu` are no longer tour steps. T3.4: `tour.ts` (driver.js) filters missing/hidden steps, skips with toast if \u003c2; custom popover rendered with semantic tokens (step counter \"x / y\", progress bar, prev/next icon buttons, Skip, close); `animate:false` on reduced motion; \"Show me around\" and \"Done\" both mark seen.\n- AC: all eight anchors present and unique; step filtering tests; tour runs on desktop, degrades on mobile; popover uses tokens only (no hardcoded hex).\n- Verify: unit tests; agent-browser at 1440 and 375.\n- Files: `tour.ts`, `TourPopover.vue`, `WhatsNewModal.vue`, `apps/web/package.json`, plus the anchor-owning components above.\n\n### Task 3.4: STT polish (M; TASKS T3.5)\n\n- Description: reshape the Phase 2 mic UX (Phase 2 is not reopened). Clicking mic turns the button into a stop (square) icon button in place; waveform becomes a rounded pill vertically centred in the prompt bar with the countdown inside; keep the small X cancel (discard, no `/stt` call); stop shows a spinner on the button while transcribing, appends text, then returns to the mic icon. Silence: `useAudioLevel` tracks whether the level ever crossed `STT_SILENCE_LEVEL_THRESHOLD` (named constant in `packages/shared/src/models/stt.ts`, beside the existing STT limits); if not, skip the `/stt` call and toast \"We didn't hear anything. Try again and speak a little closer to the mic.\" Empty Grok response (`empty_text`) toasts \"Couldn't make out any words. Try again.\" (replaces the current `grokErrorMessage` copy \"No speech detected...\" and the inline/sr-only error). Both via `showToast`, prompt unchanged.\n- AC: stop icon, pill waveform and spinner states render; silent recording makes no API call and shows toast A; empty text shows toast B; prompt unchanged in both; cancel still free; threshold is a named constant.\n- Verify: unit tests (T3.10) and e2e (T3.12); agent-browser real dictation at 1440 and 375.\n- Files: `MicButton.vue`, `Waveform.vue`, `useGrokRecorder.ts`, `useAudioLevel.ts`, `useVoiceInput.ts`, `packages/shared/src/models/stt.ts`, tests.\n\n### Task 3.5: Feature video loops and posters (M, last; TASKS T3.6)\n\n- Description: record 10 cropped real-UI clips (one per slide) from the running app with agent-browser (do not start it), dark theme, tightly cropped to the single feature; 4-6 s, muted, autoplay, loop, playsinline; WebM + MP4 fallback plus WebP poster; no GIFs or full-page screenshots; no personal data. `IntroSlide.vue` lazy-loads only current + next slide and pauses inactive; reduced motion shows poster only, no autoplay. Dark-only clips accepted. Captured after T3.5 (STT polish) so the voice clip shows the new mic.\n- AC: each clip \u003c= ~400 KB, poster \u003c 100 KB; width/height + alt set (no CLS); only current/next load; reduced motion shows poster; no personal data visible.\n- Verify: `find apps/web/public/intro` size checks for `.webm`/`.mp4` (+400k) and `.webp` (+100k) return nothing; ffprobe durations 4-6 s; autoplay/pause check in agent-browser at 1440 and 375.\n- Files: `public/intro/slide-{1..10}.{webm,mp4,webp}`, `IntroSlide.vue`, `slides.ts`.\n\n### Task 3.6: Unit and e2e tests (TASKS T3.7-T3.12)\n\n- Description: unit: persistence API (T3.7), intro logic `useIntro`/`tour.ts`/`slides.ts` (T3.8), components `WhatsNewModal`/`IntroSlide`/`FeatureList`/`TourPopover`/`UserMenu` (T3.9), STT polish `MicButton`/`Waveform`/`useGrokRecorder`/`useAudioLevel` silence (T3.10). E2E: `apps/web/e2e/qa/v2-intro.spec.ts` for new account, dismiss, reload, reopen from menu, layout, tour start, PUT failure (T3.11); extend `e2e/qa/voice-input.spec.ts` with mocked `getUserMedia` for stop icon, spinner, silence toast, empty-response toast (T3.12).\n- AC: shows once per account; reopen makes no PUT; localStorage guards a failed PUT; silence skips the `/stt` request; both specs pass with `--repeat-each=3`.\n- Verify: `cd apps/web && bunx playwright test e2e/qa/v2-intro.spec.ts e2e/qa/voice-input.spec.ts --repeat-each=3` (e2e-engineer agent); `bun run test`.\n\n### Phase 3 gate (TASKS T3.13)\n\n- [ ] New and existing account see it once; other device does not after DB write; tour covers the eight anchors; STT polish behaves per AC; clips \u003c= 400 KB and posters \u003c 100 KB; `v2-intro` and `voice-input` specs green; tests, `bun run verify`, build green\n      **Risks:** video weight (size budgets, lazy-load only current + next) and staleness (UI changes after capture; capture last), autoplay policies (muted + playsinline, poster fallback), driver.js misposition on lazy elements (ready-checks), flash before profile loads, route-guarded onboarding, silence threshold false positives on quiet mics (named constant, tune with real dictation).\n\n---\n\n# Phase 4: V2 email\n\n**Goal:** a React Email template and a resumable, idempotent Resend send script with working unsubscribe.\n\n**Files touched:** `packages/email/*` (package.json `@visual-ai/email`, `src/V2Announcement.tsx`, `src/render.ts`, snapshot test), User model (`emailOptOut`, `announcements.v2`), `apps/api/s
